<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель управления — InsurePro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50">

  <main x-data="dashboardApp()" x-init="init()" x-cloak>
    <!-- Page header -->
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-slate-800">Панель управления</h1>
      <p class="text-sm text-slate-500 mt-1">Обзор ключевых показателей</p>
    </div>

    <!-- ═══ ADMIN DASHBOARD ═══ -->
    <template x-if="role === 'admin'">
      <div>
        <!-- Widgets -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="card p-5">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-sm text-slate-500">Всего организаций</p>
                <p class="text-2xl font-bold text-slate-800 mt-1" x-text="stats.organizations"></p>
              </div>
              <div class="w-10 h-10 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 21h19.5m-18-18v18m10.5-18v18m6-13.5V21M6.75 6.75h.75m-.75 3h.75m-.75 3h.75m3-6h.75m-.75 3h.75m-.75 3h.75M6.75 21v-3.375c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21"/></svg>
              </div>
            </div>
          </div>
          <div class="card p-5">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-sm text-slate-500">Активных полисов</p>
                <p class="text-2xl font-bold text-slate-800 mt-1" x-text="stats.activePolicies"></p>
              </div>
              <div class="w-10 h-10 rounded-lg bg-green-50 text-green-600 flex items-center justify-center">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
              </div>
            </div>
          </div>
          <div class="card p-5">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-sm text-slate-500">Открытых заявок</p>
                <p class="text-2xl font-bold text-slate-800 mt-1" x-text="stats.openClaims"></p>
              </div>
              <div class="w-10 h-10 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg>
              </div>
            </div>
          </div>
          <div class="card p-5">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-sm text-slate-500">Доход за месяц</p>
                <p class="text-2xl font-bold text-slate-800 mt-1" x-text="formatCurrency(stats.monthRevenue)"></p>
              </div>
              <div class="w-10 h-10 rounded-lg bg-purple-50 text-purple-600 flex items-center justify-center">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0115.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 013 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 00-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 01-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 003 15h-.75M15 10.5a3 3 0 11-6 0 3 3 0 016 0zm3 0h.008v.008H18V10.5zm-12 0h.008v.008H6V10.5z"/></svg>
              </div>
            </div>
          </div>
        </div>

        <!-- Charts -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
          <div class="card p-6">
            <h2 class="text-lg font-semibold text-slate-800 mb-4">Статусы полисов</h2>
            <div class="relative h-64 flex items-center justify-center">
              <canvas id="policyStatusChart"></canvas>
            </div>
          </div>
          <div class="card p-6">
            <h2 class="text-lg font-semibold text-slate-800 mb-4">Доход по месяцам</h2>
            <div class="relative h-64">
              <canvas id="revenueChart"></canvas>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- ═══ MANAGER DASHBOARD ═══ -->
    <template x-if="role === 'manager'">
      <div>
        <!-- Widgets -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="card p-5">
            <p class="text-sm text-slate-500">Сотрудников</p>
            <p class="text-2xl font-bold text-slate-800 mt-1" x-text="stats.employees"></p>
          </div>
          <div class="card p-5">
            <p class="text-sm text-slate-500">Активных полисов</p>
            <p class="text-2xl font-bold text-slate-800 mt-1" x-text="stats.activePolicies"></p>
          </div>
          <div class="card p-5">
            <p class="text-sm text-slate-500">Открытых заявок</p>
            <p class="text-2xl font-bold text-slate-800 mt-1" x-text="stats.openClaims"></p>
          </div>
          <div class="card p-5">
            <p class="text-sm text-slate-500">Расходы за месяц</p>
            <p class="text-2xl font-bold text-slate-800 mt-1" x-text="formatCurrency(stats.monthExpenses)"></p>
          </div>
        </div>

        <!-- Lists -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <!-- Recent claims -->
          <div class="card p-6">
            <h2 class="text-lg font-semibold text-slate-800 mb-4">Последние заявки</h2>
            <div class="space-y-3">
              <template x-for="claim in recentClaims" :key="claim.id">
                <div class="flex items-center justify-between p-3 bg-slate-50 rounded-lg">
                  <div>
                    <p class="text-sm font-medium text-slate-800" x-text="claim.type"></p>
                    <p class="text-xs text-slate-500" x-text="claim.employee"></p>
                  </div>
                  <span class="badge" :class="'badge-' + claim.status" x-text="statusLabels[claim.status]"></span>
                </div>
              </template>
              <p x-show="recentClaims.length === 0" class="text-sm text-slate-400 text-center py-4">Нет заявок</p>
            </div>
          </div>

          <!-- Expiring policies -->
          <div class="card p-6">
            <h2 class="text-lg font-semibold text-slate-800 mb-4">Истекающие полисы</h2>
            <div class="space-y-3">
              <template x-for="policy in expiringPolicies" :key="policy.id">
                <div class="flex items-center justify-between p-3 bg-slate-50 rounded-lg">
                  <div>
                    <p class="text-sm font-medium text-slate-800" x-text="policy.plan"></p>
                    <p class="text-xs text-slate-500">Истекает: <span x-text="policy.expires"></span></p>
                  </div>
                  <a :href="'/policy.html?id=' + policy.id" class="text-sm text-blue-600 hover:underline">Подробнее</a>
                </div>
              </template>
              <p x-show="expiringPolicies.length === 0" class="text-sm text-slate-400 text-center py-4">Нет истекающих полисов</p>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- ═══ EMPLOYEE DASHBOARD ═══ -->
    <template x-if="role === 'employee'">
      <div>
        <!-- Widgets -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
          <div class="card p-5">
            <p class="text-sm text-slate-500">Мой полис</p>
            <p class="text-lg font-bold text-slate-800 mt-1" x-text="stats.myPlan || 'Нет активного полиса'"></p>
          </div>
          <div class="card p-5">
            <p class="text-sm text-slate-500">Мои заявки</p>
            <p class="text-2xl font-bold text-slate-800 mt-1" x-text="stats.myClaims"></p>
          </div>
        </div>

        <!-- Active policy card -->
        <div class="card p-6 mb-6" x-show="activePolicy">
          <h2 class="text-lg font-semibold text-slate-800 mb-4">Активный полис</h2>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <p class="text-xs text-slate-500 uppercase tracking-wide">План</p>
              <p class="text-sm font-medium text-slate-800 mt-1" x-text="activePolicy?.plan"></p>
            </div>
            <div>
              <p class="text-xs text-slate-500 uppercase tracking-wide">Действует до</p>
              <p class="text-sm font-medium text-slate-800 mt-1" x-text="activePolicy?.expires"></p>
            </div>
            <div>
              <p class="text-xs text-slate-500 uppercase tracking-wide">Статус</p>
              <span class="badge badge-active mt-1">Активен</span>
            </div>
          </div>
        </div>

        <!-- Submit claim -->
        <a href="/claims.html" class="btn btn-primary inline-flex">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          Подать заявку
        </a>
      </div>
    </template>
  </main>

  <script>
    function dashboardApp() {
      return {
        role: 'employee',
        stats: {},
        recentClaims: [],
        expiringPolicies: [],
        activePolicy: null,
        statusLabels: {
          pending: 'На рассмотрении',
          active: 'Активен',
          approved: 'Одобрена',
          rejected: 'Отклонена',
          reviewing: 'Рассматривается'
        },

        formatCurrency(val) {
          return window.InsurePro.formatCurrency(val || 0);
        },

        async init() {
          window.InsurePro.mountChrome('dashboard');
          const user = window.InsurePro.auth.user() || {};
          this.role = user.role || 'employee';
          await this.loadData();
        },

        async loadData() {
          try {
            const data = await window.InsurePro.apiFetch('/dashboard/');
            this.stats = data.stats || this.getDemoStats();
            this.recentClaims = data.recent_claims || [];
            this.expiringPolicies = data.expiring_policies || [];
            this.activePolicy = data.active_policy || null;
            this.$nextTick(() => { if (this.role === 'admin') this.renderCharts(data); });
          } catch {
            this.loadDemoData();
          }
        },

        loadDemoData() {
          this.stats = this.getDemoStats();
          this.recentClaims = [
            { id: 1, type: 'Амбулаторное лечение', employee: 'Иванов И.И.', status: 'pending' },
            { id: 2, type: 'Стоматология', employee: 'Петрова А.С.', status: 'approved' },
            { id: 3, type: 'Госпитализация', employee: 'Сидоров В.К.', status: 'reviewing' }
          ];
          this.expiringPolicies = [
            { id: 1, plan: 'Базовый ДМС', expires: '15.02.2025' },
            { id: 2, plan: 'Расширенный ДМС', expires: '28.02.2025' }
          ];
          this.activePolicy = { plan: 'Стандарт ДМС', expires: '31.12.2025' };
          this.$nextTick(() => { if (this.role === 'admin') this.renderCharts(null); });
        },

        getDemoStats() {
          if (this.role === 'admin') return { organizations: 24, activePolicies: 156, openClaims: 12, monthRevenue: 4850000 };
          if (this.role === 'manager') return { employees: 47, activePolicies: 42, openClaims: 5, monthExpenses: 1250000 };
          return { myPlan: 'Стандарт ДМС', myClaims: 2 };
        },

        renderCharts(data) {
          // Policy status doughnut
          const ctx1 = document.getElementById('policyStatusChart');
          if (ctx1) {
            new Chart(ctx1, {
              type: 'doughnut',
              data: {
                labels: ['Активные', 'Черновики', 'Приостановлены', 'Истекшие'],
                datasets: [{
                  data: data?.chart_policies || [65, 12, 8, 15],
                  backgroundColor: ['#16a34a', '#94a3b8', '#d97706', '#dc2626'],
                  borderWidth: 0
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom' } }
              }
            });
          }

          // Revenue line chart
          const ctx2 = document.getElementById('revenueChart');
          if (ctx2) {
            new Chart(ctx2, {
              type: 'line',
              data: {
                labels: ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'],
                datasets: [{
                  label: 'Доход (₽)',
                  data: data?.chart_revenue || [3200000, 3500000, 4100000, 3800000, 4200000, 4850000, 4600000, 5100000, 4900000, 5300000, 5600000, 5800000],
                  borderColor: '#2563eb',
                  backgroundColor: 'rgba(37, 99, 235, 0.08)',
                  fill: true,
                  tension: 0.4,
                  borderWidth: 2,
                  pointRadius: 3
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                  y: {
                    beginAtZero: false,
                    ticks: {
                      callback: function(val) {
                        return (val / 1000000).toFixed(1) + ' млн';
                      }
                    }
                  }
                }
              }
            });
          }
        }
      };
    }
  </script>
</body>
</html>
