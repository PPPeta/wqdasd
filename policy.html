<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Полис — InsurePro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
</head>
<body class="bg-gray-50">

  <main x-data="policyDetail()" x-init="init()" x-cloak>
    <!-- Breadcrumb -->
    <nav class="flex items-center gap-2 text-sm text-slate-500 mb-6" aria-label="Навигация">
      <a href="/policies.html" class="hover:text-blue-600 transition">Полисы</a>
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
      <span class="text-slate-800 font-medium" x-text="'Полис #' + policyId"></span>
    </nav>

    <!-- Loading -->
    <div x-show="loading" class="space-y-4">
      <div class="skeleton h-8 w-48"></div>
      <div class="skeleton h-64 w-full"></div>
    </div>

    <!-- Content -->
    <div x-show="!loading && policy">
      <!-- Header -->
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
        <div class="flex items-center gap-3">
          <h1 class="text-2xl font-bold text-slate-800" x-text="'Полис #' + policy.id"></h1>
          <span class="badge" :class="'badge-' + policy.status" x-text="statusLabels[policy.status]"></span>
        </div>
        <!-- Status management buttons -->
        <div class="flex gap-2" x-show="canManage">
          <button class="btn btn-secondary text-sm" x-show="policy.status === 'draft'" @click="changeStatus('active')">Активировать</button>
          <button class="btn btn-secondary text-sm" x-show="policy.status === 'active'" @click="changeStatus('suspended')">Приостановить</button>
          <button class="btn btn-secondary text-sm" x-show="policy.status === 'suspended'" @click="changeStatus('active')">Возобновить</button>
          <button class="btn btn-danger text-sm" x-show="policy.status !== 'cancelled' && policy.status !== 'expired'" @click="changeStatus('cancelled')">Отменить</button>
        </div>
      </div>

      <!-- Info cards -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="card p-4">
          <p class="text-xs text-slate-500 uppercase tracking-wide mb-1">Компания</p>
          <p class="text-sm font-medium text-slate-800" x-text="policy.company"></p>
        </div>
        <div class="card p-4">
          <p class="text-xs text-slate-500 uppercase tracking-wide mb-1">План</p>
          <p class="text-sm font-medium text-slate-800" x-text="policy.plan"></p>
        </div>
        <div class="card p-4">
          <p class="text-xs text-slate-500 uppercase tracking-wide mb-1">Период действия</p>
          <p class="text-sm font-medium text-slate-800" x-text="policy.start_date + ' — ' + policy.end_date"></p>
        </div>
        <div class="card p-4">
          <p class="text-xs text-slate-500 uppercase tracking-wide mb-1">Стоимость</p>
          <p class="text-sm font-medium text-slate-800" x-text="formatCurrency(policy.cost)"></p>
        </div>
      </div>

      <!-- Coverages -->
      <div class="card p-6 mb-6">
        <h2 class="text-lg font-semibold text-slate-800 mb-4">Покрытия</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
          <template x-for="(cov, idx) in policy.coverages" :key="idx">
            <div class="flex items-center gap-2 p-3 bg-slate-50 rounded-lg">
              <svg class="w-5 h-5 text-green-500 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
              <span class="text-sm text-slate-700" x-text="cov"></span>
            </div>
          </template>
        </div>
      </div>

      <!-- History -->
      <div class="card p-6">
        <h2 class="text-lg font-semibold text-slate-800 mb-4">История изменений</h2>
        <div class="overflow-x-auto">
          <table class="data-table">
            <thead>
              <tr>
                <th>Дата</th>
                <th>Действие</th>
                <th>Пользователь</th>
                <th>Комментарий</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(entry, idx) in policy.history" :key="idx">
                <tr>
                  <td class="text-sm text-slate-500" x-text="entry.date"></td>
                  <td class="text-sm font-medium" x-text="entry.action"></td>
                  <td class="text-sm text-slate-500" x-text="entry.user"></td>
                  <td class="text-sm text-slate-500" x-text="entry.comment || '—'"></td>
                </tr>
              </template>
              <tr x-show="!policy.history || policy.history.length === 0">
                <td colspan="4" class="text-center text-slate-400 py-4">Нет записей</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script>
    function policyDetail() {
      return {
        policyId: new URLSearchParams(window.location.search).get('id'),
        policy: null,
        loading: true,
        canManage: false,
        statusLabels: {
          active: 'Активен',
          draft: 'Черновик',
          suspended: 'Приостановлен',
          cancelled: 'Отменён',
          expired: 'Истёк'
        },

        formatCurrency(val) {
          return window.InsurePro.formatCurrency(val || 0);
        },

        async init() {
          window.InsurePro.mountChrome('policies');
          const user = window.InsurePro.auth.user() || {};
          this.canManage = ['admin', 'manager'].includes(user.role);
          await this.loadPolicy();
        },

        async loadPolicy() {
          if (!this.policyId) {
            window.location.href = '/policies.html';
            return;
          }
          try {
            this.policy = await window.InsurePro.apiFetch(`/policies/${this.policyId}/`);
          } catch {
            this.policy = this.getDemo();
          }
          this.loading = false;
        },

        getDemo() {
          return {
            id: this.policyId || 1001,
            plan: 'Стандарт ДМС',
            company: 'ООО «ТехноСофт»',
            start_date: '01.01.2025',
            end_date: '31.12.2025',
            cost: 2160000,
            status: 'active',
            coverages: [
              'Амбулаторное лечение',
              'Госпитализация',
              'Стоматология',
              'Офтальмология',
              'Диагностика',
              'Телемедицина',
              'Скорая помощь',
              'Реабилитация',
              'Психологическая помощь'
            ],
            history: [
              { date: '01.01.2025', action: 'Полис активирован', user: 'Админ', comment: 'Оплата подтверждена' },
              { date: '28.12.2024', action: 'Полис создан', user: 'Менеджер Иванов', comment: 'Черновик' },
              { date: '25.12.2024', action: 'Заявка на оформление', user: 'Менеджер Иванов', comment: '' }
            ]
          };
        },

        async changeStatus(newStatus) {
          try {
            await window.InsurePro.apiFetch(`/policies/${this.policyId}/status/`, {
              method: 'PATCH',
              body: { status: newStatus }
            });
            this.policy.status = newStatus;
            window.InsurePro.toast('Статус обновлён', 'success');
          } catch (err) {
            window.InsurePro.toast(err.message || 'Ошибка смены статуса', 'error');
          }
        }
      };
    }
  </script>
</body>
</html>
