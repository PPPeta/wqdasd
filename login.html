<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — InsurePro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/api.js"></script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">

  <div class="w-full max-w-md" x-data="loginForm()" x-cloak>
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center gap-2 text-blue-600 mb-2">
        <svg class="w-10 h-10" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        <span class="text-2xl font-bold">InsurePro</span>
      </div>
      <p class="text-slate-500 text-sm">Корпоративное страхование для бизнеса</p>
    </div>

    <!-- Card -->
    <div class="card p-8">
      <h1 class="text-xl font-semibold text-slate-800 mb-6">Вход в систему</h1>

      <!-- Error -->
      <div x-show="error" x-transition class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700 flex items-center gap-2" role="alert">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg>
        <span x-text="error"></span>
      </div>

      <form @submit.prevent="submit" novalidate>
        <!-- Email -->
        <div class="field mb-4">
          <label for="email">Электронная почта</label>
          <input
            type="email"
            id="email"
            x-model="form.email"
            :aria-invalid="errors.email ? 'true' : 'false'"
            autocomplete="email"
            placeholder="name@company.ru"
            required
          >
          <span class="error" x-show="errors.email" x-text="errors.email"></span>
        </div>

        <!-- Password -->
        <div class="field mb-4">
          <label for="password">Пароль</label>
          <div class="relative">
            <input
              :type="showPassword ? 'text' : 'password'"
              id="password"
              x-model="form.password"
              :aria-invalid="errors.password ? 'true' : 'false'"
              autocomplete="current-password"
              placeholder="Введите пароль"
              required
            >
            <button
              type="button"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition"
              @click="showPassword = !showPassword"
              :aria-label="showPassword ? 'Скрыть пароль' : 'Показать пароль'"
            >
              <svg x-show="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              <svg x-show="showPassword" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
            </button>
          </div>
          <span class="error" x-show="errors.password" x-text="errors.password"></span>
        </div>

        <!-- Remember / Forgot -->
        <div class="flex items-center justify-between mb-6">
          <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
            <input type="checkbox" x-model="form.remember" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
            <span>Запомнить меня</span>
          </label>
          <a href="#" class="text-sm text-blue-600 hover:text-blue-800 font-medium">Забыли пароль?</a>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          class="btn btn-primary w-full"
          :disabled="loading"
        >
          <svg x-show="loading" class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
          <span x-text="loading ? 'Вход...' : 'Войти'"></span>
        </button>
      </form>
    </div>

    <!-- Register link -->
    <p class="text-center mt-6 text-sm text-slate-500">
      Нет аккаунта?
      <a href="/register.html" class="text-blue-600 hover:text-blue-800 font-medium">Зарегистрировать компанию</a>
    </p>
  </div>

  <script>
    function loginForm() {
      return {
        form: { email: '', password: '', remember: false },
        errors: {},
        error: '',
        loading: false,
        showPassword: false,

        validate() {
          this.errors = {};
          if (!this.form.email.trim()) {
            this.errors.email = 'Введите электронную почту';
          } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.form.email)) {
            this.errors.email = 'Некорректный формат почты';
          }
          if (!this.form.password) {
            this.errors.password = 'Введите пароль';
          } else if (this.form.password.length < 6) {
            this.errors.password = 'Минимум 6 символов';
          }
          return Object.keys(this.errors).length === 0;
        },

        async submit() {
          this.error = '';
          if (!this.validate()) return;

          this.loading = true;
          try {
            await window.InsurePro.auth.login(this.form.email, this.form.password, this.form.remember);
            window.InsurePro.toast('Добро пожаловать!', 'success');
            setTimeout(() => { window.location.href = '/dashboard.html'; }, 300);
          } catch (err) {
            this.error = err.message || 'Неверный логин или пароль';
          } finally {
            this.loading = false;
          }
        }
      };
    }
  </script>
</body>
</html>
