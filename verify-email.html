<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Подтверждение email · InsurePro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-slate-100 text-slate-900 antialiased">
  <main class="min-h-screen grid place-items-center p-4">
    <section class="w-full max-w-md" x-data="verifyForm()" x-cloak>
      <div class="card p-8 space-y-6 text-center">
        <span class="mx-auto grid h-14 w-14 place-items-center rounded-full bg-blue-100 text-blue-600" aria-hidden="true">
          <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M3 19.5v-15A2.25 2.25 0 015.25 2.25h13.5A2.25 2.25 0 0121 4.5v15"/></svg>
        </span>
        <div>
          <h1 class="text-xl font-bold">Подтвердите email</h1>
          <p class="text-sm text-slate-500 mt-1">
            Мы отправили 6-значный код на
            <strong class="text-slate-700" x-text="email || 'ваш email'"></strong>
          </p>
        </div>

        <form class="space-y-4" @submit.prevent="submit">
          <div class="field">
            <label for="code" class="sr-only">Код подтверждения</label>
            <input id="code" inputmode="numeric" pattern="\d{6}" maxlength="6" required
                   x-model="code"
                   @input="code = code.replace(/\D/g, '').slice(0, 6)"
                   class="text-center text-2xl tracking-[0.5em] font-mono"
                   placeholder="000000" autocomplete="one-time-code">
          </div>

          <button type="submit" class="btn btn-primary w-full" :disabled="code.length !== 6">Подтвердить</button>

          <p class="error" x-show="error" x-text="error" role="alert"></p>
        </form>

        <p class="text-sm text-slate-500">
          Не получили код?
          <button type="button"
                  class="text-blue-600 font-medium hover:underline disabled:text-slate-400 disabled:no-underline"
                  @click="resend" :disabled="cooldown > 0">
            <span x-show="cooldown === 0">Отправить повторно</span>
            <span x-show="cooldown > 0" x-text="`Повторно через ${cooldown}с`"></span>
          </button>
        </p>
      </div>

      <p class="mt-6 text-center text-sm">
        <a href="login.html" class="text-slate-500 hover:text-slate-700">← Вернуться ко входу</a>
      </p>
    </section>
  </main>

  <script>
    function verifyForm() {
      return {
        code: '', email: '', cooldown: 0, error: '',

        init() {
          this.email = sessionStorage.getItem('pending_verify_email') || '';
        },

        submit() {
          if (this.code.length !== 6) return;
          // TODO(API): POST /auth/verify-email/ с {email, code}
          // При успехе — редирект на dashboard.html
          sessionStorage.removeItem('pending_verify_email');
          window.location.href = 'dashboard.html';
        },

        resend() {
          // TODO(API): POST /auth/send-verify-email/?email=...
          this.cooldown = 60;
          const t = setInterval(() => {
            if (--this.cooldown <= 0) clearInterval(t);
          }, 1000);
        },
      };
    }
  </script>
</body>
</html>
