<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Обращение · InsurePro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <script src="js/mock.js"></script>
  <script src="js/layout.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
  <a href="#main" class="skip-link">К содержимому</a>
  <header class="sticky top-0 z-30 bg-white border-b border-slate-200 h-16 flex items-center px-4 sm:px-6 justify-between" data-chrome-navbar></header>
  <div class="flex">
    <aside data-chrome-sidebar class="w-64 shrink-0 bg-white"></aside>
    <div data-chrome-backdrop aria-hidden="true"></div>

    <main id="main" class="flex-1 p-4 sm:p-8 max-w-full" x-data="claimPage()" x-init="init()">
      <nav class="mb-6 text-sm">
        <a href="claims.html" class="text-slate-500 hover:text-slate-700">Обращения</a>
        <span class="mx-2 text-slate-400">/</span>
        <span class="text-slate-900 font-medium" x-text="claim.number"></span>
      </nav>

      <div class="grid lg:grid-cols-3 gap-6">
        <section class="card p-6 lg:col-span-2">
          <header class="flex items-start justify-between gap-4 mb-4">
            <div>
              <h1 class="text-2xl font-bold" x-text="'Обращение ' + claim.number"></h1>
              <p class="text-sm text-slate-500 mt-1" x-text="TYPE_LABELS[claim.type]"></p>
            </div>
            <span class="badge" :class="`badge-${claim.status}`" x-text="STATUS_LABELS[claim.status]"></span>
          </header>

          <dl class="grid sm:grid-cols-2 gap-4 mb-6">
            <div><dt class="text-xs text-slate-500 uppercase">Сотрудник</dt><dd class="mt-1 font-medium" x-text="claim.employee_name"></dd></div>
            <div><dt class="text-xs text-slate-500 uppercase">Полис</dt><dd class="mt-1" x-text="claim.policy_number"></dd></div>
            <div><dt class="text-xs text-slate-500 uppercase">Дата случая</dt><dd class="mt-1" x-text="formatDate(claim.incident_date)"></dd></div>
            <div><dt class="text-xs text-slate-500 uppercase">Место</dt><dd class="mt-1" x-text="claim.place"></dd></div>
            <div><dt class="text-xs text-slate-500 uppercase">Сумма</dt><dd class="mt-1 font-semibold text-blue-700" x-text="formatRub(claim.amount)"></dd></div>
            <div><dt class="text-xs text-slate-500 uppercase">Подано</dt><dd class="mt-1" x-text="formatDateTime(claim.created_at)"></dd></div>
          </dl>

          <div>
            <h2 class="font-semibold mb-2">Описание</h2>
            <p class="text-sm text-slate-700 whitespace-pre-line" x-text="claim.description"></p>
          </div>

          <div class="mt-6" x-show="(claim.documents || []).length">
            <h2 class="font-semibold mb-3">Документы</h2>
            <ul class="space-y-2">
              <template x-for="doc in (claim.documents || [])" :key="doc.id">
                <li>
                  <a :href="doc.url" target="_blank" rel="noopener"
                     class="flex items-center gap-3 rounded-lg border border-slate-200 p-3 hover:bg-slate-50">
                    <span class="grid h-10 w-10 place-items-center rounded-lg bg-blue-50 text-blue-600">
                      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
                    </span>
                    <span class="flex-1 min-w-0">
                      <span class="block font-medium truncate" x-text="doc.name"></span>
                      <span class="text-xs text-slate-500" x-text="doc.size_label"></span>
                    </span>
                  </a>
                </li>
              </template>
            </ul>
          </div>
        </section>

        <aside class="space-y-6">
          <div class="card p-6" x-show="$store.auth.hasRole('admin', 'company_manager') && claim.status === 'pending'">
            <h2 class="font-semibold mb-3">Решение</h2>
            <div class="flex flex-col gap-2">
              <button type="button" class="btn btn-primary" @click="decide('approved')">Одобрить</button>
              <button type="button" class="btn btn-danger" @click="decide('rejected')">Отклонить</button>
            </div>
          </div>

          <div class="card p-6">
            <h2 class="font-semibold mb-4">Таймлайн</h2>
            <ol class="relative border-l-2 border-slate-200 ml-2 space-y-4">
              <template x-for="(step, i) in timeline" :key="i">
                <li class="pl-4 relative">
                  <span class="absolute -left-[7px] top-1.5 h-3 w-3 rounded-full" :class="step.done ? 'bg-blue-600' : 'bg-slate-300'" aria-hidden="true"></span>
                  <p class="text-sm font-medium" x-text="step.label"></p>
                  <p class="text-xs text-slate-500" x-text="step.date || '—'"></p>
                </li>
              </template>
            </ol>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <script>
    InsurePro.mountChrome('claims');

    const STATUS_LABELS = { pending: 'В ожидании', approved: 'Одобрено', rejected: 'Отклонено' };
    const TYPE_LABELS = { medical: 'Медуслуга', hospitalization: 'Госпитализация', medication: 'Медикаменты', dental: 'Стоматология' };

    function claimPage() {
      return {
        claim: {},
        timeline: [],
        STATUS_LABELS, TYPE_LABELS,

        init() {
          // TODO(API): GET /claims/{id}/ по ?id= из URL
          this.claim = InsurePro.MOCK.claimDetail;
          this.timeline = [
            { label: 'Заявка подана', date: this.formatDateTime(this.claim.created_at), done: true },
            { label: 'На рассмотрении', date: this.formatDateTime(this.claim.in_review_at), done: Boolean(this.claim.in_review_at) },
            { label: this.claim.status === 'rejected' ? 'Решение: отклонено' : 'Решение: одобрено', date: this.formatDateTime(this.claim.decided_at), done: ['approved','rejected'].includes(this.claim.status) },
          ];
        },

        decide(status) {
          if (!confirm(status === 'approved' ? 'Одобрить обращение?' : 'Отклонить обращение?')) return;
          // TODO(API): PATCH /claims/{id}/ { status }
          this.claim.status = status;
          this.claim.decided_at = new Date().toISOString();
          this.init();
        },

        formatDate(d) { return d ? new Date(d).toLocaleDateString('ru-RU') : '—'; },
        formatDateTime(d) { return d ? new Date(d).toLocaleString('ru-RU') : ''; },
      };
    }
    function formatRub(v) {
      return new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB', maximumFractionDigits: 0 }).format(v || 0);
    }
  </script>
</body>
</html>
