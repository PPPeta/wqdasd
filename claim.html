<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заявка — InsurePro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
</head>
<body class="bg-gray-50">

  <main x-data="claimDetail()" x-init="init()" x-cloak>
    <!-- Breadcrumb -->
    <nav class="flex items-center gap-2 text-sm text-slate-500 mb-6" aria-label="Навигация">
      <a href="/claims.html" class="hover:text-blue-600 transition">Заявки</a>
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
      <span class="text-slate-800 font-medium" x-text="'Заявка #' + claimId"></span>
    </nav>

    <!-- Loading -->
    <div x-show="loading" class="space-y-4">
      <div class="skeleton h-8 w-48"></div>
      <div class="skeleton h-64 w-full"></div>
    </div>

    <!-- Content -->
    <div x-show="!loading && claim">
      <!-- Header -->
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
        <div class="flex items-center gap-3">
          <h1 class="text-2xl font-bold text-slate-800" x-text="'Заявка #' + claim.id"></h1>
          <span class="badge" :class="'badge-' + claim.status" x-text="statusLabels[claim.status]"></span>
        </div>
        <!-- Approve / Reject buttons for manager/admin -->
        <div class="flex gap-2" x-show="canDecide && claim.status === 'reviewing'">
          <button class="btn btn-primary text-sm" @click="decide('approved')">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
            Одобрить
          </button>
          <button class="btn btn-danger text-sm" @click="decide('rejected')">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            Отклонить
          </button>
        </div>
      </div>

      <!-- Info grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <!-- Main info -->
        <div class="card p-6">
          <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wide mb-4">Информация о заявке</h2>
          <dl class="space-y-3">
            <div class="flex justify-between">
              <dt class="text-sm text-slate-500">Тип обращения</dt>
              <dd class="text-sm font-medium text-slate-800" x-text="claim.type"></dd>
            </div>
            <div class="flex justify-between">
              <dt class="text-sm text-slate-500">Дата события</dt>
              <dd class="text-sm font-medium text-slate-800" x-text="claim.date"></dd>
            </div>
            <div class="flex justify-between">
              <dt class="text-sm text-slate-500">Место</dt>
              <dd class="text-sm font-medium text-slate-800" x-text="claim.place || '—'"></dd>
            </div>
            <div class="flex justify-between">
              <dt class="text-sm text-slate-500">Сумма</dt>
              <dd class="text-sm font-bold text-slate-800" x-text="formatCurrency(claim.amount)"></dd>
            </div>
          </dl>
        </div>

        <!-- Employee & Policy -->
        <div class="card p-6">
          <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wide mb-4">Сотрудник и полис</h2>
          <dl class="space-y-3">
            <div class="flex justify-between">
              <dt class="text-sm text-slate-500">Сотрудник</dt>
              <dd class="text-sm font-medium text-slate-800" x-text="claim.employee"></dd>
            </div>
            <div class="flex justify-between">
              <dt class="text-sm text-slate-500">Полис</dt>
              <dd class="text-sm font-medium text-slate-800" x-text="'#' + claim.policy_id"></dd>
            </div>
            <div class="flex justify-between">
              <dt class="text-sm text-slate-500">План</dt>
              <dd class="text-sm font-medium text-slate-800" x-text="claim.plan"></dd>
            </div>
          </dl>
        </div>
      </div>

      <!-- Description -->
      <div class="card p-6 mb-6">
        <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wide mb-3">Описание</h2>
        <p class="text-sm text-slate-700 leading-relaxed" x-text="claim.description"></p>
      </div>

      <!-- Documents -->
      <div class="card p-6 mb-6">
        <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wide mb-4">Документы</h2>
        <div class="space-y-2" x-show="claim.documents && claim.documents.length > 0">
          <template x-for="(doc, idx) in claim.documents" :key="idx">
            <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg">
              <svg class="w-5 h-5 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
              <span class="text-sm text-slate-700 flex-1" x-text="doc.name"></span>
              <a :href="doc.url || '#'" class="text-sm text-blue-600 hover:underline">Скачать</a>
            </div>
          </template>
        </div>
        <p x-show="!claim.documents || claim.documents.length === 0" class="text-sm text-slate-400">Документы не прикреплены</p>
      </div>

      <!-- Timeline -->
      <div class="card p-6">
        <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wide mb-4">Ход рассмотрения</h2>
        <div class="relative">
          <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-slate-200"></div>
          <div class="space-y-6">
            <template x-for="(step, idx) in claim.timeline" :key="idx">
              <div class="relative flex gap-4 pl-10">
                <div class="absolute left-2.5 w-3 h-3 rounded-full border-2"
                  :class="step.completed ? 'bg-blue-600 border-blue-600' : 'bg-white border-slate-300'"></div>
                <div>
                  <p class="text-sm font-medium text-slate-800" x-text="step.title"></p>
                  <p class="text-xs text-slate-500 mt-0.5" x-text="step.date || 'Ожидается'"></p>
                  <p class="text-xs text-slate-400 mt-0.5" x-show="step.comment" x-text="step.comment"></p>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    function claimDetail() {
      return {
        claimId: new URLSearchParams(window.location.search).get('id'),
        claim: null,
        loading: true,
        canDecide: false,
        statusLabels: {
          pending: 'На рассмотрении',
          reviewing: 'Рассматривается',
          approved: 'Одобрена',
          rejected: 'Отклонена'
        },

        formatCurrency(val) {
          return window.InsurePro.formatCurrency(val || 0);
        },

        async init() {
          window.InsurePro.mountChrome('claims');
          const user = window.InsurePro.auth.user() || {};
          this.canDecide = ['admin', 'manager'].includes(user.role);
          await this.loadClaim();
        },

        async loadClaim() {
          if (!this.claimId) {
            window.location.href = '/claims.html';
            return;
          }
          try {
            this.claim = await window.InsurePro.apiFetch(`/claims/${this.claimId}/`);
          } catch {
            this.claim = this.getDemo();
          }
          this.loading = false;
        },

        getDemo() {
          return {
            id: this.claimId || 501,
            type: 'Амбулаторное лечение',
            status: 'reviewing',
            employee: 'Иванов Иван Иванович',
            policy_id: 1001,
            plan: 'Стандарт ДМС',
            date: '15.01.2025',
            place: 'Москва, клиника «Медицина»',
            amount: 12500,
            description: 'Обращение по поводу острой боли в спине. Проведён приём терапевта, назначены обследования (МРТ, анализы крови). Рекомендовано лечение курсом физиотерапии.',
            documents: [
              { name: 'Направление_терапевт.pdf', url: '#' },
              { name: 'Результаты_МРТ.pdf', url: '#' },
              { name: 'Чек_оплата.jpg', url: '#' }
            ],
            timeline: [
              { title: 'Заявка подана', date: '15.01.2025, 10:30', completed: true, comment: '' },
              { title: 'Принята в обработку', date: '15.01.2025, 14:15', completed: true, comment: 'Менеджер Петров А.В.' },
              { title: 'На рассмотрении', date: '16.01.2025, 09:00', completed: true, comment: 'Проверка документов' },
              { title: 'Решение', date: '', completed: false, comment: '' }
            ]
          };
        },

        async decide(decision) {
          try {
            await window.InsurePro.apiFetch(`/claims/${this.claimId}/decide/`, {
              method: 'POST',
              body: { decision }
            });
            this.claim.status = decision;
            window.InsurePro.toast(decision === 'approved' ? 'Заявка одобрена' : 'Заявка отклонена', decision === 'approved' ? 'success' : 'info');
          } catch (err) {
            window.InsurePro.toast(err.message || 'Ошибка', 'error');
          }
        }
      };
    }
  </script>
</body>
</html>
