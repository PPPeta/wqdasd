<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сотрудники — InsurePro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
</head>
<body class="bg-gray-50">

  <main x-data="employeesApp()" x-init="init()" x-cloak>
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">Сотрудники</h1>
        <p class="text-sm text-slate-500 mt-1">Управление сотрудниками компании</p>
      </div>
      <button class="btn btn-primary" @click="openModal()">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
        Добавить сотрудника
      </button>
    </div>

    <!-- Filters -->
    <div class="card p-4 mb-6">
      <div class="flex flex-col sm:flex-row gap-3">
        <div class="flex-1 relative">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
          <input
            type="text"
            x-model="search"
            @input="debounceSearch()"
            class="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
            placeholder="Поиск по имени, email или должности..."
            aria-label="Поиск сотрудников"
          >
        </div>
        <select x-model="statusFilter" @change="loadEmployees()" class="px-4 py-2.5 border border-slate-200 rounded-lg text-sm bg-white" aria-label="Фильтр по статусу">
          <option value="">Все статусы</option>
          <option value="active">Активные</option>
          <option value="inactive">Неактивные</option>
        </select>
      </div>
    </div>

    <!-- Table -->
    <div class="card overflow-hidden">
      <div class="overflow-x-auto">
        <table class="data-table">
          <thead>
            <tr>
              <th>Сотрудник</th>
              <th>Должность</th>
              <th>Email</th>
              <th>Статус</th>
              <th class="text-right">Действия</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="emp in employees" :key="emp.id">
              <tr>
                <td>
                  <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center text-sm font-semibold" x-text="getInitials(emp.name)"></div>
                    <span class="font-medium" x-text="emp.name"></span>
                  </div>
                </td>
                <td x-text="emp.position"></td>
                <td class="text-slate-500" x-text="emp.email"></td>
                <td>
                  <span class="badge" :class="emp.status === 'active' ? 'badge-active' : 'badge-cancelled'" x-text="emp.status === 'active' ? 'Активен' : 'Неактивен'"></span>
                </td>
                <td class="text-right">
                  <button class="btn btn-ghost text-sm px-3 py-1.5" @click="openModal(emp)" aria-label="Редактировать">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125"/></svg>
                  </button>
                </td>
              </tr>
            </template>
            <tr x-show="employees.length === 0">
              <td colspan="5" class="text-center text-slate-400 py-8">Сотрудники не найдены</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="flex items-center justify-between p-4 border-t border-slate-100" x-show="totalPages > 1">
        <span class="text-sm text-slate-500">Страница <span x-text="page"></span> из <span x-text="totalPages"></span></span>
        <div class="flex gap-2">
          <button class="btn btn-secondary text-sm px-3 py-1.5" :disabled="page <= 1" @click="page--; loadEmployees()">← Назад</button>
          <button class="btn btn-secondary text-sm px-3 py-1.5" :disabled="page >= totalPages" @click="page++; loadEmployees()">Далее →</button>
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div x-show="showModal" x-transition.opacity class="fixed inset-0 z-50 flex items-center justify-center p-4" style="display:none;">
      <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" @click="showModal = false"></div>
      <div class="relative w-full max-w-lg card p-6" @click.away="showModal = false">
        <h2 class="text-lg font-semibold text-slate-800 mb-5" x-text="editingEmployee ? 'Редактировать сотрудника' : 'Добавить сотрудника'"></h2>

        <form @submit.prevent="saveEmployee" novalidate>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
            <div class="field">
              <label for="emp-name">ФИО</label>
              <input type="text" id="emp-name" x-model="form.name" :aria-invalid="formErrors.name ? 'true' : 'false'" placeholder="Иванов Иван Иванович">
              <span class="error" x-show="formErrors.name" x-text="formErrors.name"></span>
            </div>
            <div class="field">
              <label for="emp-email">Email</label>
              <input type="email" id="emp-email" x-model="form.email" :aria-invalid="formErrors.email ? 'true' : 'false'" placeholder="ivanov@company.ru">
              <span class="error" x-show="formErrors.email" x-text="formErrors.email"></span>
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
            <div class="field">
              <label for="emp-position">Должность</label>
              <input type="text" id="emp-position" x-model="form.position" placeholder="Менеджер">
            </div>
            <div class="field">
              <label for="emp-phone">Телефон</label>
              <input type="tel" id="emp-phone" x-model="form.phone" placeholder="+79001234567">
            </div>
          </div>
          <div class="field mb-6">
            <label for="emp-status">Статус</label>
            <select id="emp-status" x-model="form.status">
              <option value="active">Активен</option>
              <option value="inactive">Неактивен</option>
            </select>
          </div>
          <div class="flex justify-end gap-3">
            <button type="button" class="btn btn-secondary" @click="showModal = false">Отмена</button>
            <button type="submit" class="btn btn-primary" :disabled="saving">
              <span x-text="saving ? 'Сохранение...' : 'Сохранить'"></span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script>
    function employeesApp() {
      return {
        employees: [],
        search: '',
        statusFilter: '',
        page: 1,
        totalPages: 1,
        perPage: 10,
        showModal: false,
        editingEmployee: null,
        form: { name: '', email: '', position: '', phone: '', status: 'active' },
        formErrors: {},
        saving: false,
        debounceTimer: null,

        async init() {
          window.InsurePro.mountChrome('employees');
          await this.loadEmployees();
        },

        debounceSearch() {
          clearTimeout(this.debounceTimer);
          this.debounceTimer = setTimeout(() => {
            this.page = 1;
            this.loadEmployees();
          }, 300);
        },

        async loadEmployees() {
          try {
            const params = new URLSearchParams({ page: this.page, per_page: this.perPage });
            if (this.search) params.set('search', this.search);
            if (this.statusFilter) params.set('status', this.statusFilter);
            const data = await window.InsurePro.apiFetch(`/employees/?${params}`);
            this.employees = data.results || data;
            this.totalPages = data.total_pages || Math.ceil((data.count || this.employees.length) / this.perPage);
          } catch {
            this.loadDemo();
          }
        },

        loadDemo() {
          const demo = [
            { id: 1, name: 'Иванов Иван Иванович', email: 'ivanov@company.ru', position: 'Разработчик', phone: '+79001234567', status: 'active' },
            { id: 2, name: 'Петрова Анна Сергеевна', email: 'petrova@company.ru', position: 'Дизайнер', phone: '+79001234568', status: 'active' },
            { id: 3, name: 'Сидоров Виктор Константинович', email: 'sidorov@company.ru', position: 'Менеджер', phone: '+79001234569', status: 'inactive' },
            { id: 4, name: 'Козлова Мария Александровна', email: 'kozlova@company.ru', position: 'Бухгалтер', phone: '+79001234570', status: 'active' },
            { id: 5, name: 'Новиков Дмитрий Олегович', email: 'novikov@company.ru', position: 'Тестировщик', phone: '+79001234571', status: 'active' }
          ];
          let filtered = demo;
          if (this.search) {
            const s = this.search.toLowerCase();
            filtered = filtered.filter(e => e.name.toLowerCase().includes(s) || e.email.toLowerCase().includes(s) || e.position.toLowerCase().includes(s));
          }
          if (this.statusFilter) filtered = filtered.filter(e => e.status === this.statusFilter);
          this.employees = filtered;
          this.totalPages = 1;
        },

        getInitials(name) {
          if (!name) return '?';
          return name.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
        },

        openModal(emp = null) {
          this.editingEmployee = emp;
          this.formErrors = {};
          if (emp) {
            this.form = { ...emp };
          } else {
            this.form = { name: '', email: '', position: '', phone: '', status: 'active' };
          }
          this.showModal = true;
        },

        async saveEmployee() {
          this.formErrors = {};
          if (!this.form.name.trim()) this.formErrors.name = 'Введите ФИО';
          if (!this.form.email.trim()) this.formErrors.email = 'Введите email';
          else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.form.email)) this.formErrors.email = 'Некорректный email';
          if (Object.keys(this.formErrors).length) return;

          this.saving = true;
          try {
            if (this.editingEmployee) {
              await window.InsurePro.apiFetch(`/employees/${this.editingEmployee.id}/`, { method: 'PUT', body: this.form });
              window.InsurePro.toast('Сотрудник обновлён', 'success');
            } else {
              await window.InsurePro.apiFetch('/employees/', { method: 'POST', body: this.form });
              window.InsurePro.toast('Сотрудник добавлен', 'success');
            }
            this.showModal = false;
            await this.loadEmployees();
          } catch (err) {
            window.InsurePro.toast(err.message || 'Ошибка сохранения', 'error');
          } finally {
            this.saving = false;
          }
        }
      };
    }
  </script>
</body>
</html>
