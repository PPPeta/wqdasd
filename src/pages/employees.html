<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сотрудники · InsurePro</title>
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/components.css">
</head>
<body>
  <div class="app-layout">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">IP</div>
        <span>InsurePro</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Дашборд
        </a>
        <a href="employees.html" class="active">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Сотрудники
        </a>
        <a href="policies.html">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Полисы
        </a>
        <a href="claims.html">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Обращения
        </a>
        <a href="plans.html">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          Планы
        </a>
        <a href="reports.html">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Отчёты
        </a>
      </nav>
      <div class="sidebar-footer">InsurePro · v1.0</div>
    </aside>
    <div class="sidebar-backdrop"></div>

    <!-- MAIN -->
    <div class="app-main">
      <header class="navbar">
        <div class="navbar-left">
          <button class="sidebar-toggle" aria-label="Меню">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
          </button>
        </div>
        <div class="navbar-right">
          <div class="navbar-user">
            <div class="navbar-user-info">
              <div class="navbar-user-name"></div>
              <div class="navbar-user-role"></div>
            </div>
            <div class="navbar-avatar"></div>
          </div>
          <button class="btn btn-sm ghost btn-logout">Выйти</button>
        </div>
      </header>

      <div class="app-content">
        <div class="section-header" style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
          <div>
            <h1>Сотрудники</h1>
            <p>Всего: <span id="total-count">8</span></p>
          </div>
          <button class="btn primary" onclick="openModal('modal-employee')">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Добавить сотрудника
          </button>
        </div>

        <!-- Filters -->
        <div style="display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;">
          <div class="input-group" style="margin-bottom: 0; flex: 1; min-width: 200px;">
            <input type="text" id="search-input" placeholder=" " oninput="filterTable()">
            <label>Поиск по имени или email</label>
          </div>
          <select id="status-filter" onchange="filterTable()" style="padding: 12px 16px; border: 1.5px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); font-size: 0.9375rem;">
            <option value="all">Все</option>
            <option value="active">Активные</option>
            <option value="inactive">Деактивированные</option>
          </select>
        </div>

        <!-- Table -->
        <div class="card" style="overflow-x: auto;">
          <table class="data-table">
            <thead>
              <tr>
                <th>Имя</th>
                <th>Email</th>
                <th>Статус</th>
                <th>Полисы</th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody id="employees-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-employee">
    <div class="modal">
      <div class="modal-header">
        <h2>Добавить сотрудника</h2>
        <button class="modal-close" onclick="closeModal('modal-employee')">✕</button>
      </div>
      <form id="form-employee" onsubmit="handleAddEmployee(event)">
        <div class="input-group">
          <input type="email" id="emp-email" placeholder=" " required>
          <label>Email</label>
        </div>
        <div class="input-group">
          <input type="text" id="emp-first-name" placeholder=" " required>
          <label>Имя</label>
        </div>
        <div class="input-group">
          <input type="text" id="emp-last-name" placeholder=" " required>
          <label>Фамилия</label>
        </div>
        <div style="display: flex; gap: 12px; justify-content: flex-end;">
          <button type="button" class="btn secondary" onclick="closeModal('modal-employee')">Отмена</button>
          <button type="submit" class="btn primary">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../scripts/mock.js"></script>
  <script src="../scripts/app.js"></script>
  <script>
    (function() {
      function renderTable(data) {
        const tbody = document.getElementById('employees-tbody');
        tbody.innerHTML = '';
        data.forEach(emp => {
          const initials = (emp.first_name[0] + emp.last_name[0]).toUpperCase();
          const statusClass = emp.is_active ? 'badge-active' : 'badge-cancelled';
          const statusText = emp.is_active ? 'Активен' : 'Деактивирован';
          const actionBtn = emp.is_active
            ? '<button class="btn btn-sm ghost">Деактивировать</button>'
            : '<button class="btn btn-sm ghost">Активировать</button>';
          tbody.innerHTML += `
            <tr>
              <td style="display: flex; align-items: center; gap: 10px;">
                <div style="width:36px;height:36px;border-radius:50%;background:var(--color-primary-bg);color:var(--color-primary);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:0.8125rem;flex-shrink:0;">${initials}</div>
                <span>${emp.first_name} ${emp.last_name}</span>
              </td>
              <td>${emp.email}</td>
              <td><span class="badge ${statusClass}">${statusText}</span></td>
              <td>${emp.policies_count}</td>
              <td style="display:flex;gap:8px;">
                <button class="btn btn-sm secondary">Изменить</button>
                ${actionBtn}
              </td>
            </tr>`;
        });
        document.getElementById('total-count').textContent = data.length;
      }

      window.filterTable = function() {
        const search = document.getElementById('search-input').value.toLowerCase();
        const status = document.getElementById('status-filter').value;
        let filtered = MOCK.employees;
        if (status === 'active') filtered = filtered.filter(e => e.is_active);
        if (status === 'inactive') filtered = filtered.filter(e => !e.is_active);
        if (search) {
          filtered = filtered.filter(e =>
            (e.first_name + ' ' + e.last_name).toLowerCase().includes(search) ||
            e.email.toLowerCase().includes(search)
          );
        }
        renderTable(filtered);
      };

      window.handleAddEmployee = function(e) {
        e.preventDefault();
        const email = document.getElementById('emp-email').value;
        const firstName = document.getElementById('emp-first-name').value;
        const lastName = document.getElementById('emp-last-name').value;
        MOCK.employees.push({ id: Date.now(), first_name: firstName, last_name: lastName, email: email, is_active: true, policies_count: 0 });
        closeModal('modal-employee');
        document.getElementById('form-employee').reset();
        filterTable();
      };

      renderTable(MOCK.employees);
    })();
  </script>
</body>
</html>
