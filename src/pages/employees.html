      </nav>

    </aside>
    <div class="sidebar-backdrop"></div>

    <div class="app-main">
      <header class="navbar">
        <div class="navbar-left">
          <button class="sidebar-toggle" aria-label="Меню">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
          </button>
        </div>
        <div class="navbar-right">
          <div class="navbar-user">
            <div class="navbar-user-info">
              <div class="navbar-user-name"></div>
              <div class="navbar-user-role"></div>
            </div>
            <div class="navbar-avatar"></div>
          </div>
          <button class="btn ghost btn-sm btn-logout">Выйти</button>
        </div>
      </header>

      <div class="app-content">
        <div class="section-header">
          <div class="section-header-left">
            <h1>Сотрудники</h1>
            <p class="subtitle">Всего: <span id="emp-total">0</span></p>
          </div>
          <div class="section-header-actions">
            <button class="btn primary" data-modal-open="modal-employee">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
              Добавить сотрудника
            </button>
          </div>
        </div>

        <div class="toolbar">
          <div class="search-input">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="search" id="emp-search" placeholder="Поиск по имени или email">
          </div>
          <div class="filter-tabs" id="emp-filters">
            <button class="filter-tab active" data-filter="all">Все</button>
            <button class="filter-tab" data-filter="active">Активные</button>
            <button class="filter-tab" data-filter="inactive">Деактивированные</button>
          </div>
        </div>

        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th>Имя</th>
                <th>Email</th>
                <th>Должность</th>
                <th>Статус</th>
                <th>Полисы</th>
                <th style="text-align:right;">Действия</th>
              </tr>
            </thead>
            <tbody id="emp-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- ============== MODAL: NEW/EDIT EMPLOYEE ============== -->
  <div class="modal-overlay" id="modal-employee">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="emp-modal-title">Добавить сотрудника</div>
        <button class="modal-close" data-modal-close aria-label="Закрыть">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="emp-form" novalidate>
          <div class="input-group">
            <input type="email" id="emp-email" placeholder=" " required>
            <label for="emp-email">Email</label>
          </div>
          <div class="input-group">
            <input type="text" id="emp-first" placeholder=" " required>
            <label for="emp-first">Имя</label>
          </div>
          <div class="input-group">
            <input type="text" id="emp-last" placeholder=" " required>
            <label for="emp-last">Фамилия</label>
          </div>
          <div class="input-group">
            <input type="text" id="emp-position" placeholder=" ">
            <label for="emp-position">Должность</label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn secondary" data-modal-close>Отмена</button>
        <button class="btn primary" id="emp-save">Сохранить</button>
      </div>
    </div>
  </div>

  <script src="../scripts/mock.js"></script>
  <script src="../scripts/app.js"></script>
  <script>
    let filter = 'all';
    let query = '';
    const body = document.getElementById('emp-body');
    const totalEl = document.getElementById('emp-total');

    function render() {
      let list = MOCK.employees.slice();
      if (filter === 'active') list = list.filter((e) => e.is_active);
      if (filter === 'inactive') list = list.filter((e) => !e.is_active);
      if (query) {
        const q = query.toLowerCase();
        list = list.filter((e) =>
          (e.first_name + ' ' + e.last_name).toLowerCase().includes(q) ||
          e.email.toLowerCase().includes(q)
        );
      }
      totalEl.textContent = list.length;

      if (list.length === 0) {
        body.innerHTML = tableEmptyRow(6, 'Попробуйте изменить фильтр или поисковый запрос');
        return;
      }

      body.innerHTML = list.map((e) => {
        const initials = getInitials(e.first_name, e.last_name);
        const badge = e.is_active
          ? '<span class="badge badge-active">Активен</span>'
          : '<span class="badge badge-expired">Деактивирован</span>';
        const toggleText = e.is_active ? 'Деактивировать' : 'Активировать';
        return `
          <tr>
            <td>
              <div class="cell-user">
                <div class="avatar-sm">${initials}</div>
                <div>
                  <div style="font-weight:600;color:var(--text);">${esc(e.first_name)} ${esc(e.last_name)}</div>
                </div>
              </div>
            </td>
            <td>${esc(e.email)}</td>
            <td>${esc(e.position || '—')}</td>
            <td>${badge}</td>
            <td>${e.policies_count}</td>
            <td>
              <div class="cell-actions">
                <button class="btn ghost btn-sm" data-action="edit" data-id="${e.id}">Изменить</button>
                <button class="btn ${e.is_active ? 'danger' : 'success'} btn-sm" data-action="toggle" data-id="${e.id}">${toggleText}</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }
    render();

    // Filters
    document.getElementById('emp-filters').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-tab');
      if (!btn) return;
      document.querySelectorAll('#emp-filters .filter-tab').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      render();
    });

    // Search
    document.getElementById('emp-search').addEventListener('input', (e) => {
      query = e.target.value;
      render();
    });

    // Row actions
    body.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const id = Number(btn.dataset.id);
      const emp = MOCK.employees.find((x) => x.id === id);
      if (!emp) return;

      if (btn.dataset.action === 'toggle') {
        // TODO(API): PATCH /api/employees/:id { is_active }
        emp.is_active = !emp.is_active;
        if (!emp.is_active) emp.policies_count = 0;
        render();
      } else if (btn.dataset.action === 'edit') {
        document.getElementById('emp-modal-title').textContent = 'Изменить сотрудника';
        document.getElementById('emp-email').value = emp.email;
        document.getElementById('emp-first').value = emp.first_name;
        document.getElementById('emp-last').value = emp.last_name;
        document.getElementById('emp-position').value = emp.position || '';
        document.getElementById('emp-save').dataset.editId = id;
        openModal('modal-employee');
      }
    });

    // Open for create
    document.querySelector('[data-modal-open="modal-employee"]').addEventListener('click', () => {
      document.getElementById('emp-modal-title').textContent = 'Добавить сотрудника';
      document.getElementById('emp-form').reset();
      delete document.getElementById('emp-save').dataset.editId;
    });

    // Save
    document.getElementById('emp-save').addEventListener('click', () => {
      const email = document.getElementById('emp-email').value.trim();
      const first = document.getElementById('emp-first').value.trim();
      const last = document.getElementById('emp-last').value.trim();
      const position = document.getElementById('emp-position').value.trim();
      if (!email || !first || !last) {
        alert('Заполните обязательные поля');
        return;
      }
      const editId = document.getElementById('emp-save').dataset.editId;
      if (editId) {
        // TODO(API): PATCH /api/employees/:id
        const emp = MOCK.employees.find((x) => x.id === Number(editId));
        Object.assign(emp, { email, first_name: first, last_name: last, position });
      } else {
        // TODO(API): POST /api/employees
        const id = Math.max(0, ...MOCK.employees.map((e) => e.id)) + 1;
        MOCK.employees.unshift({ id, email, first_name: first, last_name: last, position, is_active: true, policies_count: 0 });
      }
      closeModal('modal-employee');
      render();
    });
  </script>
</body>

</html>
