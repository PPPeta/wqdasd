<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Полис · InsurePro</title>
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/components.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">IP</div>
        <span>InsurePro</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Дашборд
        </a>
        <a href="employees.html">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Сотрудники
        </a>
        <a href="policies.html" class="active">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Полисы
        </a>
        <a href="claims.html">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Обращения
        </a>
        <a href="plans.html">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          Планы
        </a>
        <a href="reports.html">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Отчёты
        </a>
      </nav>
      <div class="sidebar-footer">InsurePro · v1.0</div>
    </aside>
    <div class="sidebar-backdrop"></div>

    <div class="app-main">
      <header class="navbar">
        <div class="navbar-left">
          <button class="sidebar-toggle" aria-label="Меню">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
          </button>
        </div>
        <div class="navbar-right">
          <div class="navbar-user">
            <div class="navbar-user-info">
              <div class="navbar-user-name"></div>
              <div class="navbar-user-role"></div>
            </div>
            <div class="navbar-avatar"></div>
          </div>
          <button class="btn btn-sm ghost btn-logout">Выйти</button>
        </div>
      </header>

      <div class="app-content">
        <!-- Breadcrumb -->
        <div style="margin-bottom:16px;font-size:0.875rem;">
          <a href="policies.html" style="color:var(--color-primary);">Полисы</a>
          <span style="color:var(--color-text-muted);"> → </span>
          <span id="breadcrumb-number">POL-2024-001</span>
        </div>

        <!-- Header -->
        <div class="section-header" style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
          <h1 id="policy-title">Полис POL-2024-001</h1>
          <span class="badge badge-active" id="policy-status-badge">Активен</span>
          <button class="btn secondary btn-sm" style="margin-left:auto;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Скачать PDF
          </button>
        </div>

        <!-- Two column -->
        <div style="display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-bottom:32px;" class="detail-grid">
          <div class="card" style="padding:24px;">
            <h3 style="margin-bottom:16px;font-weight:600;">Информация о полисе</h3>
            <dl id="policy-dl" style="display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;"></dl>
          </div>
          <div class="card" style="padding:24px;">
            <h3 style="margin-bottom:16px;font-weight:600;">Управление</h3>
            <div style="display:flex;flex-direction:column;gap:10px;">
              <button class="btn primary btn-full">Продлить полис</button>
              <button class="btn secondary btn-full">Приостановить</button>
              <button class="btn danger btn-full">Отменить полис</button>
            </div>
          </div>
        </div>

        <!-- Coverages -->
        <div class="card" style="padding:24px;margin-bottom:24px;">
          <h3 style="margin-bottom:16px;font-weight:600;">Покрытия</h3>
          <div class="grid-3" id="coverages-grid"></div>
        </div>

        <!-- History -->
        <div class="card" style="padding:24px;">
          <h3 style="margin-bottom:16px;font-weight:600;">История изменений</h3>
          <table class="data-table">
            <thead>
              <tr>
                <th>Дата</th>
                <th>Событие</th>
                <th>Автор</th>
              </tr>
            </thead>
            <tbody id="history-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <style>
    @media (max-width: 768px) {
      .detail-grid { grid-template-columns: 1fr !important; }
    }
    #policy-dl dt { font-size: 0.8125rem; color: var(--color-text-secondary); }
    #policy-dl dd { font-size: 0.9375rem; font-weight: 500; margin: 0; }
  </style>

  <script src="../scripts/mock.js"></script>
  <script src="../scripts/app.js"></script>
  <script>
    // Add policyDetail mock data
    if (!MOCK.policyDetail) {
      MOCK.policyDetail = {
        number: 'POL-2024-001',
        company: 'ООО «Ромашка»',
        plan: 'Стандарт',
        status: 'active',
        start: '2024-01-15',
        end: '2025-01-14',
        employees: 45,
        monthlyCost: 144000,
        coverages: [
          { name: 'Амбулаторная помощь', limit: '500 000 ₽' },
          { name: 'Госпитализация', limit: '1 000 000 ₽' },
          { name: 'Стоматология', limit: '150 000 ₽' },
          { name: 'Медикаменты', limit: '100 000 ₽' },
          { name: 'Вызов врача на дом', limit: '50 000 ₽' },
          { name: 'Диагностика', limit: '300 000 ₽' },
        ],
        history: [
          { date: '2024-01-15', event: 'Полис создан и активирован', author: 'Иван Петров' },
          { date: '2024-03-10', event: 'Добавлено 5 сотрудников', author: 'Иван Петров' },
          { date: '2024-06-01', event: 'Изменён план: Базовый → Стандарт', author: 'Админ' },
        ]
      };
    }

    (function() {
      const d = MOCK.policyDetail;

      document.getElementById('breadcrumb-number').textContent = d.number;
      document.getElementById('policy-title').textContent = 'Полис ' + d.number;

      const badge = document.getElementById('policy-status-badge');
      badge.className = 'badge badge-' + d.status;
      badge.textContent = STATUS_LABELS[d.status];

      // DL
      const dl = document.getElementById('policy-dl');
      const fields = [
        ['Компания', d.company],
        ['План', d.plan],
        ['Начало', formatDate(d.start)],
        ['Конец', formatDate(d.end)],
        ['Сотрудников', d.employees],
        ['Ежемесячно', formatRub(d.monthlyCost)],
      ];
      fields.forEach(([label, val]) => {
        dl.innerHTML += `<dt>${label}</dt><dd>${val}</dd>`;
      });

      // Coverages
      const cg = document.getElementById('coverages-grid');
      d.coverages.forEach(c => {
        cg.innerHTML += `
          <div style="padding:16px;background:var(--color-bg);border-radius:var(--radius-md);border:1px solid var(--color-border-light);">
            <div style="font-weight:500;margin-bottom:4px;">${c.name}</div>
            <div style="font-size:0.875rem;color:var(--color-text-secondary);">Лимит: ${c.limit}</div>
          </div>`;
      });

      // History
      const ht = document.getElementById('history-tbody');
      d.history.forEach(h => {
        ht.innerHTML += `
          <tr>
            <td>${formatDate(h.date)}</td>
            <td>${h.event}</td>
            <td>${h.author}</td>
          </tr>`;
      });
    })();
  </script>
</body>
</html>
