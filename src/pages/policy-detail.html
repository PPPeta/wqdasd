    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">IP</div>
        <span>InsurePro</span>

      <nav class="sidebar-nav">
        <a href="dashboard.html" data-roles="admin,company_manager,employee"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1V10"/></svg> Дашборд</a>
        <a href="employees.html" data-roles="admin,company_manager"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Сотрудники</a>
        <a href="policies.html" data-roles="admin,company_manager,employee" class="active"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h6"/></svg> Полисы</a>
        <a href="claims.html" data-roles="admin,company_manager,employee"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg> Обращения</a>
        <a href="plans.html" data-roles="admin,company_manager"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg> Планы</a>
        <a href="reports.html" data-roles="admin,company_manager"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 16V8"/><path d="M12 16V6"/><path d="M17 16v-4"/></svg> Отчёты</a>
        <a href="organizations.html" data-roles="admin"> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M8 10h.01"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 14h.01"/><path d="M16 14h.01"/><path d="M12 14h.01"/></svg> Организации </a> <a href="users.html" data-roles="admin"> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-3-3.87"/><path d="M4 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Пользователи </a> <a href="audit-log.html" data-roles="admin"> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10l4 2"/><circle cx="12" cy="12" r="10"/></svg> Журнал действий </a>
      </nav>
      <div class="sidebar-footer">InsurePro · v1.0</div>
    </aside>
    <div class="sidebar-backdrop"></div>

    <div class="app-main">
      <header class="navbar">
        <div class="navbar-left">
          <button class="sidebar-toggle" aria-label="Меню">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
          </button>
        </div>
        <div class="navbar-right">
          <div class="navbar-user">
            <div class="navbar-user-info">
              <div class="navbar-user-name"></div>
              <div class="navbar-user-role"></div>
            </div>
            <div class="navbar-avatar"></div>
          </div>
          <button class="btn ghost btn-sm btn-logout">Выйти</button>
        </div>
      </header>

      <div class="app-content">
        <div class="breadcrumbs">
          <a href="policies.html" data-roles="admin,company_manager,employee">Полисы</a>
          <span class="sep">/</span>
          <span class="current" id="bc-number">POL-2024-001</span>
        </div>

        <div class="section-header">
          <div class="section-header-left">
            <h1 id="pol-title">POL-2024-001</h1>
            <p class="subtitle"><span id="pol-plan"></span> · <span id="pol-company"></span></p>
          </div>
          <div class="section-header-actions">
            <span class="badge" id="pol-status"></span>
            <button class="btn secondary" onclick="alert('PDF готовится (TODO: API)')">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
              Скачать PDF
            </button>
          </div>
        </div>

        <div class="grid-2-3">
          <div class="card">
            <div class="card-header">
              <div class="card-title">Информация о полисе</div>
            </div>
            <dl class="dl" id="pol-info"></dl>
          </div>

          <div class="card">
            <div class="card-header">
              <div class="card-title">Управление</div>
            </div>
            <div class="flex flex-col gap-2">
              <button class="btn primary btn-full" onclick="handleAction('renew')">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.4 0 4.6.9 6.3 2.4L21 8"/><path d="M21 3v5h-5"/></svg>
                Продлить
              </button>
              <button class="btn secondary btn-full" onclick="handleAction('suspend')">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>
                Приостановить
              </button>
              <button class="btn danger btn-full" onclick="handleAction('cancel')">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
                Отменить
              </button>
            </div>
          </div>
        </div>

        <div class="card mt-6">
          <div class="card-header">
            <div>
              <div class="card-title">Покрытия</div>
              <div class="card-subtitle">Виды медицинской помощи, доступные по полису</div>
            </div>
          </div>
          <div class="coverage-grid" id="pol-coverages"></div>
        </div>

        <div class="card mt-6">
          <div class="card-header">
            <div class="card-title">История изменений</div>
          </div>
          <div class="table-wrapper" style="border:0;box-shadow:none;">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Дата</th>
                  <th>Событие</th>
                  <th>Автор</th>
                </tr>
              </thead>
              <tbody id="pol-history"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../scripts/mock.js"></script>
  <script src="../scripts/app.js"></script>
  <script>
    const p = MOCK.policyDetail;

    document.getElementById('bc-number').textContent = p.number;
    document.getElementById('pol-title').textContent = p.number;
    document.getElementById('pol-plan').textContent = p.plan;
    document.getElementById('pol-company').textContent = p.company;

    const statusEl = document.getElementById('pol-status');
    statusEl.className = 'badge badge-' + p.status;
    statusEl.textContent = STATUS_LABELS[p.status];

    // Info dl
    const info = [
      ['Компания', p.company],
      ['ИНН', p.inn],
      ['План', p.plan],
      ['Начало', formatDate(p.start)],
      ['Конец', formatDate(p.end)],
      ['Сотрудников', String(p.employees)],
      ['Ежемесячно', formatRub(p.monthly)],
      ['Итого за год', formatRub(p.total)],
    ];
    document.getElementById('pol-info').innerHTML = info.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');

    // Coverages
    const check = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    document.getElementById('pol-coverages').innerHTML = p.coverages.map((c) => `
      <div class="coverage-item">${check} <span>${esc(c)}</span></div>
    `).join('');

    // History
    document.getElementById('pol-history').innerHTML = p.history.map((h) => `
      <tr>
        <td>${formatDate(h.date)}</td>
        <td>${esc(h.event)}</td>
        <td>${esc(h.user)}</td>
      </tr>
    `).join('');

    window.handleAction = function (action) {
      const labels = { renew: 'Продлить', suspend: 'Приостановить', cancel: 'Отменить' };
      if (!confirm(`${labels[action]} полис ${p.number}?`)) return;
      // TODO(API): POST /api/policies/:id/${action}
      alert('Действие выполнено (демо).');
    };
  </script>
</body>

</html>
