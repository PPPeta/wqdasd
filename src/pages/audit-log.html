    <div class="sidebar-backdrop"></div>

    <div class="app-main">
      <header class="navbar">
        <div class="navbar-left">
          <button class="sidebar-toggle" aria-label="Меню">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
          </button>
        </div>
        <div class="navbar-right">
          <div class="navbar-user">
            <div class="navbar-user-info">
              <div class="navbar-user-name"></div>
              <div class="navbar-user-role"></div>
            </div>
            <div class="navbar-avatar"></div>
          </div>
          <button class="btn ghost btn-sm btn-logout">Выйти</button>
        </div>
      </header>

      <div class="app-content">
        <div class="section-header">
          <div class="section-header-left">
            <h1>Журнал действий</h1>
            <p class="subtitle">Все операции пользователей в системе · <span id="audit-total">0</span> записей</p>
          </div>
          <div class="section-header-actions">
            <button class="btn secondary" id="audit-export">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
              Экспорт CSV
            </button>
          </div>
        </div>

        <div class="toolbar">
          <div class="search-input">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="search" id="audit-search" placeholder="Поиск по пользователю, действию или объекту">
          </div>
          <div class="filter-tabs" id="audit-filters">
            <button class="filter-tab active" data-filter="all">Все</button>
            <button class="filter-tab" data-filter="login">Входы</button>
            <button class="filter-tab" data-filter="policy">Полисы</button>
            <button class="filter-tab" data-filter="claim">Обращения</button>
            <button class="filter-tab" data-filter="user">Пользователи</button>
          </div>
        </div>

        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th>Время</th>
                <th>Пользователь</th>
                <th>Действие</th>
                <th>Объект</th>
                <th>IP-адрес</th>
                <th>Подробности</th>
              </tr>
            </thead>
            <tbody id="audit-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="../scripts/mock.js"></script>
  <script src="../scripts/app.js"></script>
  <script>
    let filter = 'all';
    let query = '';
    const body = document.getElementById('audit-body');
    const totalEl = document.getElementById('audit-total');

    const ACTION_LABELS = {
      'LOGIN': { text: 'Вход', badge: 'info' },
      'user.update': { text: 'Обновление профиля', badge: 'info' },
      'user.deactivate': { text: 'Деактивация пользователя', badge: 'suspended' },
      'user.activate': { text: 'Активация пользователя', badge: 'active' },
      'policy.create': { text: 'Создание полиса', badge: 'info' },
      'policy.activate': { text: 'Активация полиса', badge: 'active' },
      'policy.suspend': { text: 'Приостановка полиса', badge: 'suspended' },
      'policy.cancel': { text: 'Отмена полиса', badge: 'expired' },
      'policy.renew': { text: 'Продление полиса', badge: 'active' },
      'claim.submit': { text: 'Подача обращения', badge: 'pending' },
      'claim.approve': { text: 'Одобрение обращения', badge: 'approved' },
      'claim.reject': { text: 'Отклонение обращения', badge: 'rejected' },
      'plan.create': { text: 'Создание плана', badge: 'info' },
    };

    function matchesFilter(entry) {
      if (filter === 'all') return true;
      if (filter === 'login') return entry.action === 'LOGIN';
      if (filter === 'policy') return entry.action.startsWith('policy.');
      if (filter === 'claim') return entry.action.startsWith('claim.');
      if (filter === 'user') return entry.action.startsWith('user.');
      return true;
    }

    function render() {
      let list = MOCK.auditLog.slice();
      list = list.filter(matchesFilter);
      if (query) {
        const q = query.toLowerCase();
        list = list.filter((e) =>
          (e.user || '').toLowerCase().includes(q) ||
          (e.action || '').toLowerCase().includes(q) ||
          (e.entity || '').toLowerCase().includes(q) ||
          (e.details || '').toLowerCase().includes(q)
        );
      }
      totalEl.textContent = list.length;

      if (list.length === 0) {
        body.innerHTML = tableEmptyRow(6, 'По выбранным фильтрам ничего не найдено');
        return;
      }

      body.innerHTML = list.map((e) => {
        const meta = ACTION_LABELS[e.action] || { text: e.action, badge: 'info' };
        return `
          <tr>
            <td style="font-family:monospace;font-size:.85rem;white-space:nowrap;">${esc(e.at)}</td>
            <td style="font-weight:500;color:var(--text);">${esc(e.user)}</td>
            <td><span class="badge badge-${meta.badge}">${meta.text}</span></td>
            <td style="font-family:monospace;">${esc(e.entity)}</td>
            <td style="font-family:monospace;color:var(--text-muted);">${esc(e.ip)}</td>
            <td style="color:var(--text-soft);">${esc(e.details)}</td>
          </tr>
        `;
      }).join('');
    }
    render();

    // Filters
    document.getElementById('audit-filters').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-tab');
      if (!btn) return;
      document.querySelectorAll('#audit-filters .filter-tab').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      render();
    });
    document.getElementById('audit-search').addEventListener('input', (e) => {
      query = e.target.value;
      render();
    });

    // Export (fake CSV)
    document.getElementById('audit-export').addEventListener('click', () => {
      // TODO(API): GET /reports/export/csv?type=audit
      alert('Экспорт журнала в CSV будет реализован после интеграции бэкенда.');
    });
  </script>
</body>

</html>
