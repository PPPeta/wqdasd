<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Обращения · InsurePro</title>
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/components.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">IP</div>
        <span>InsurePro</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Дашборд
        </a>
        <a href="employees.html">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Сотрудники
        </a>
        <a href="policies.html">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Полисы
        </a>
        <a href="claims.html" class="active">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Обращения
        </a>
        <a href="plans.html">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          Планы
        </a>
        <a href="reports.html">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Отчёты
        </a>
      </nav>
      <div class="sidebar-footer">InsurePro · v1.0</div>
    </aside>
    <div class="sidebar-backdrop"></div>

    <div class="app-main">
      <header class="navbar">
        <div class="navbar-left">
          <button class="sidebar-toggle" aria-label="Меню">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
          </button>
        </div>
        <div class="navbar-right">
          <div class="navbar-user">
            <div class="navbar-user-info">
              <div class="navbar-user-name"></div>
              <div class="navbar-user-role"></div>
            </div>
            <div class="navbar-avatar"></div>
          </div>
          <button class="btn btn-sm ghost btn-logout">Выйти</button>
        </div>
      </header>

      <div class="app-content">
        <div class="section-header" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
          <h1>Страховые обращения</h1>
          <button class="btn primary" onclick="openModal('modal-claim')">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Подать обращение
          </button>
        </div>

        <!-- Filter tabs -->
        <div class="filter-tabs" style="margin-bottom:20px;" id="claim-tabs">
          <button class="filter-tab active" data-filter="all">Все</button>
          <button class="filter-tab" data-filter="pending">В ожидании</button>
          <button class="filter-tab" data-filter="approved">Одобренные</button>
          <button class="filter-tab" data-filter="rejected">Отклонённые</button>
        </div>

        <!-- Table -->
        <div class="card" style="overflow-x:auto;">
          <table class="data-table">
            <thead>
              <tr>
                <th>Номер</th>
                <th>Тип</th>
                <th>Сотрудник</th>
                <th>Статус</th>
                <th>Сумма</th>
                <th>Дата</th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody id="claims-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-claim">
    <div class="modal">
      <div class="modal-header">
        <h2>Подать обращение</h2>
        <button class="modal-close" onclick="closeModal('modal-claim')">✕</button>
      </div>
      <form id="form-claim" onsubmit="handleSubmitClaim(event)">
        <div class="input-group">
          <select id="claim-type" required>
            <option value="" disabled selected></option>
            <option value="medical">Медуслуга</option>
            <option value="dental">Стоматология</option>
            <option value="hospitalization">Госпитализация</option>
            <option value="medication">Медикаменты</option>
          </select>
          <label>Тип обращения</label>
        </div>
        <div class="input-group">
          <textarea id="claim-desc" rows="3" placeholder=" " required style="resize:vertical;"></textarea>
          <label>Описание</label>
        </div>
        <div class="input-group">
          <input type="date" id="claim-date" required placeholder=" ">
          <label>Дата случая</label>
        </div>
        <div class="input-group">
          <input type="number" id="claim-amount" placeholder=" " required min="0">
          <label>Сумма (₽)</label>
        </div>
        <div class="input-group">
          <input type="text" id="claim-place" placeholder=" ">
          <label>Место</label>
        </div>
        <div class="input-group">
          <input type="file" id="claim-file" style="padding-top:18px;">
          <label style="top:0;font-size:0.75rem;color:var(--color-primary);font-weight:500;">Документы</label>
        </div>
        <div style="display:flex;gap:12px;justify-content:flex-end;">
          <button type="button" class="btn secondary" onclick="closeModal('modal-claim')">Отмена</button>
          <button type="submit" class="btn primary">Отправить</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../scripts/mock.js"></script>
  <script src="../scripts/app.js"></script>
  <script>
    (function() {
      let currentFilter = 'all';

      function renderTable(filter) {
        const tbody = document.getElementById('claims-tbody');
        tbody.innerHTML = '';
        let data = MOCK.claims;
        if (filter !== 'all') data = data.filter(c => c.status === filter);
        data.forEach(c => {
          const statusClass = 'badge-' + c.status;
          tbody.innerHTML += `
            <tr>
              <td style="font-weight:500;">${c.number}</td>
              <td>${TYPE_LABELS[c.type]}</td>
              <td>${c.employee}</td>
              <td><span class="badge ${statusClass}">${STATUS_LABELS[c.status]}</span></td>
              <td>${formatRub(c.amount)}</td>
              <td>${formatDate(c.date)}</td>
              <td><a href="claim-detail.html?id=${c.id}" style="color:var(--color-primary);font-weight:500;font-size:0.875rem;">Открыть →</a></td>
            </tr>`;
        });
      }

      document.getElementById('claim-tabs').addEventListener('click', function(e) {
        if (e.target.classList.contains('filter-tab')) {
          document.querySelectorAll('#claim-tabs .filter-tab').forEach(t => t.classList.remove('active'));
          e.target.classList.add('active');
          currentFilter = e.target.dataset.filter;
          renderTable(currentFilter);
        }
      });

      window.handleSubmitClaim = function(e) {
        e.preventDefault();
        const newClaim = {
          id: Date.now(),
          number: 'CL-2024-' + String(MOCK.claims.length + 42).padStart(3, '0'),
          type: document.getElementById('claim-type').value,
          employee: MOCK_USER.first_name + ' ' + MOCK_USER.last_name,
          status: 'pending',
          amount: Number(document.getElementById('claim-amount').value),
          date: document.getElementById('claim-date').value,
          description: document.getElementById('claim-desc').value,
        };
        MOCK.claims.unshift(newClaim);
        closeModal('modal-claim');
        document.getElementById('form-claim').reset();
        renderTable(currentFilter);
      };

      renderTable(currentFilter);
    })();
  </script>
</body>
</html>
