<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Планы · InsurePro</title>
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/components.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">IP</div>
        <span>InsurePro</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Дашборд
        </a>
        <a href="employees.html">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Сотрудники
        </a>
        <a href="policies.html">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Полисы
        </a>
        <a href="claims.html">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Обращения
        </a>
        <a href="plans.html" class="active">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          Планы
        </a>
        <a href="reports.html">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Отчёты
        </a>
      </nav>
      <div class="sidebar-footer">InsurePro · v1.0</div>
    </aside>
    <div class="sidebar-backdrop"></div>

    <div class="app-main">
      <header class="navbar">
        <div class="navbar-left">
          <button class="sidebar-toggle" aria-label="Меню">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
          </button>
        </div>
        <div class="navbar-right">
          <div class="navbar-user">
            <div class="navbar-user-info">
              <div class="navbar-user-name"></div>
              <div class="navbar-user-role"></div>
            </div>
            <div class="navbar-avatar"></div>
          </div>
          <button class="btn btn-sm ghost btn-logout">Выйти</button>
        </div>
      </header>

      <div class="app-content">
        <div class="section-header" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
          <h1>Планы страхования</h1>
          <div style="display:flex;gap:10px;">
            <button class="btn secondary" onclick="openModal('modal-calculator')">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/></svg>
              Калькулятор
            </button>
            <button class="btn primary">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Создать план
            </button>
          </div>
        </div>

        <!-- Plans grid -->
        <div class="grid-3" id="plans-grid"></div>
      </div>
    </div>
  </div>

  <!-- Calculator Modal -->
  <div class="modal-overlay" id="modal-calculator">
    <div class="modal">
      <div class="modal-header">
        <h2>Калькулятор стоимости</h2>
        <button class="modal-close" onclick="closeModal('modal-calculator')">✕</button>
      </div>
      <div class="input-group">
        <select id="calc-plan" required>
          <option value="" disabled selected></option>
        </select>
        <label>Выберите план</label>
      </div>
      <div class="input-group">
        <input type="number" id="calc-employees" placeholder=" " min="1" required>
        <label>Количество сотрудников</label>
      </div>
      <button class="btn primary btn-full" onclick="calculate()" style="margin-bottom:16px;">Рассчитать</button>
      <div id="calc-result" style="padding:16px;background:var(--color-bg);border-radius:var(--radius-md);text-align:center;display:none;">
        <div style="font-size:0.8125rem;color:var(--color-text-secondary);margin-bottom:4px;">Стоимость в месяц</div>
        <div id="calc-total" style="font-size:1.5rem;font-weight:700;color:var(--color-primary);"></div>
      </div>
    </div>
  </div>

  <script src="../scripts/mock.js"></script>
  <script src="../scripts/app.js"></script>
  <script>
    (function() {
      const grid = document.getElementById('plans-grid');
      const calcSelect = document.getElementById('calc-plan');

      MOCK.plans.forEach(plan => {
        const featured = plan.featured ? 'border:2px solid var(--color-primary);box-shadow:var(--shadow-glow);' : '';
        const coveragesHtml = plan.coverages.map(c => `
          <li style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:0.875rem;color:var(--color-text-secondary);">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="var(--color-success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            ${c}
          </li>`).join('');

        grid.innerHTML += `
          <div class="card" style="padding:28px;display:flex;flex-direction:column;${featured}">
            ${plan.featured ? '<div style="font-size:0.75rem;font-weight:600;color:var(--color-primary);margin-bottom:8px;">РЕКОМЕНДУЕМ</div>' : ''}
            <h3 style="font-size:1.25rem;font-weight:700;margin-bottom:4px;">${plan.name}</h3>
            <p style="font-size:0.875rem;color:var(--color-text-secondary);margin-bottom:16px;">${plan.description}</p>
            <div style="margin-bottom:20px;">
              <span style="font-size:1.75rem;font-weight:700;">${formatRub(plan.price)}</span>
              <span style="font-size:0.8125rem;color:var(--color-text-muted);"> / сотрудник / мес</span>
            </div>
            <ul style="flex:1;margin-bottom:20px;">${coveragesHtml}</ul>
            <button class="btn ${plan.featured ? 'primary' : 'secondary'} btn-full" onclick="openModal('modal-calculator')">Рассчитать стоимость</button>
          </div>`;

        // Also populate calc select
        calcSelect.innerHTML += `<option value="${plan.id}">${plan.name} — ${formatRub(plan.price)}/чел.</option>`;
      });

      window.calculate = function() {
        const planId = Number(document.getElementById('calc-plan').value);
        const count = Number(document.getElementById('calc-employees').value);
        if (!planId || !count) return;
        const plan = MOCK.plans.find(p => p.id === planId);
        const total = plan.price * count;
        document.getElementById('calc-total').textContent = formatRub(total);
        document.getElementById('calc-result').style.display = 'block';
      };
    })();
  </script>
</body>
</html>
