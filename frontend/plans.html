<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Планы страхования · InsurePro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
  <a href="#main" class="skip-link">К содержимому</a>
  <header class="sticky top-0 z-30 bg-white border-b border-slate-200 h-16 flex items-center px-4 sm:px-6 justify-between" data-chrome-navbar></header>
  <div class="flex">
    <aside data-chrome-sidebar class="w-64 shrink-0 bg-white"></aside>
    <div data-chrome-backdrop aria-hidden="true"></div>

    <main id="main" class="flex-1 p-4 sm:p-8 max-w-full" x-data="plansPage()" x-init="load()">
      <header class="mb-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div>
          <h1 class="text-2xl sm:text-3xl font-bold">Планы страхования</h1>
          <p class="text-sm text-slate-500 mt-1">Выберите подходящий план для вашей компании</p>
        </div>
        <div class="flex gap-2">
          <button type="button" class="btn btn-secondary" @click="openCalc()">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 15.75l-2.489-2.489m0 0a3.375 3.375 0 10-4.773-4.773 3.375 3.375 0 004.774 4.774zM21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            Калькулятор
          </button>
          <button type="button" x-show="$store.auth.hasRole('admin')" class="btn btn-primary">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
            Создать план
          </button>
        </div>
      </header>

      <section class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3" aria-label="Доступные планы">
        <template x-for="plan in plans" :key="plan.id">
          <article class="card p-6 flex flex-col relative overflow-hidden" :class="plan.featured && 'ring-2 ring-blue-500'">
            <span x-show="plan.featured" class="absolute top-4 right-4 rounded-full bg-blue-600 text-white px-3 py-1 text-xs font-semibold">Популярный</span>
            <h2 class="text-xl font-bold" x-text="plan.name"></h2>
            <p class="text-sm text-slate-500 mt-1" x-text="plan.description"></p>
            <div class="mt-6 mb-6">
              <span class="text-4xl font-bold" x-text="formatRub(plan.price_per_employee)"></span>
              <span class="text-slate-500 text-sm">/сотр./мес</span>
            </div>
            <ul class="space-y-2.5 mb-6 flex-1" aria-label="Покрытия">
              <template x-for="c in (plan.coverages || [])" :key="c">
                <li class="flex items-start gap-2 text-sm">
                  <svg class="h-4 w-4 text-green-500 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
                  <span x-text="c"></span>
                </li>
              </template>
            </ul>
            <button type="button" class="btn" :class="plan.featured ? 'btn-primary' : 'btn-secondary'" @click="openCalc(plan.id)">
              Рассчитать стоимость
            </button>
          </article>
        </template>
        <template x-if="loading">
          <template x-for="i in 3">
            <div class="card p-6"><div class="skeleton h-6 w-1/2 mb-4"></div><div class="skeleton h-10 w-1/3 mb-6"></div><div class="skeleton h-32"></div></div>
          </template>
        </template>
      </section>

      <!-- Calculator modal -->
      <div x-show="calc.open" x-transition.opacity class="fixed inset-0 z-50 grid place-items-center bg-slate-900/60 p-4" role="dialog" aria-modal="true" aria-labelledby="calc-title" @keydown.escape.window="calc.open = false">
        <div class="card w-full max-w-md p-6" @click.stop>
          <header class="flex items-center justify-between mb-4">
            <h2 id="calc-title" class="text-lg font-semibold">Калькулятор стоимости</h2>
            <button type="button" class="p-1 rounded-lg hover:bg-slate-100" @click="calc.open = false" aria-label="Закрыть">
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </header>
          <form @submit.prevent="calculate()" class="space-y-4">
            <div class="field">
              <label for="calc-plan">План</label>
              <select id="calc-plan" x-model.number="calc.planId" required>
                <option value="">Выберите план</option>
                <template x-for="p in plans" :key="p.id">
                  <option :value="p.id" x-text="`${p.name} — ${formatRub(p.price_per_employee)}/сотр./мес`"></option>
                </template>
              </select>
            </div>
            <div class="field">
              <label for="calc-count">Количество сотрудников</label>
              <input id="calc-count" type="number" min="1" required x-model.number="calc.employees">
            </div>
            <button type="submit" class="btn btn-primary w-full" :disabled="calc.loading" x-text="calc.loading ? 'Расчёт...' : 'Рассчитать'"></button>

            <div x-show="calc.result" x-transition class="mt-4 rounded-xl bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-100 p-5 text-center">
              <p class="text-sm text-slate-600">Итого к оплате</p>
              <p class="text-3xl font-bold text-blue-700 mt-1" x-text="formatRub(calc.result?.total)"></p>
              <p class="text-xs text-slate-500 mt-1">в месяц</p>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script>
    InsurePro.mountChrome('plans');

    function plansPage() {
      return {
        plans: [],
        loading: false,
        calc: { open: false, planId: '', employees: 10, loading: false, result: null },

        async load() {
          this.loading = true;
          try {
            const data = await InsurePro.api('GET', '/plans/').catch(() => this.demoPlans());
            this.plans = Array.isArray(data) ? data : (data.results || this.demoPlans());
          } catch (err) {
            this.plans = this.demoPlans();
          } finally {
            this.loading = false;
          }
        },

        demoPlans() {
          return [
            { id: 1, name: 'Базовый', description: 'Необходимый минимум', price_per_employee: 1500,
              coverages: ['Амбулаторная помощь', 'Вызов врача на дом', 'Экстренная стоматология'] },
            { id: 2, name: 'Стандарт', description: 'Оптимальный выбор', price_per_employee: 3200, featured: true,
              coverages: ['Всё из Базового', 'Госпитализация', 'Плановая стоматология', 'Медикаменты'] },
            { id: 3, name: 'Премиум', description: 'Максимальная защита', price_per_employee: 5800,
              coverages: ['Всё из Стандарт', 'Частные клиники', 'Чек-апы', 'Санаторное лечение', 'ДМС членам семьи'] },
          ];
        },

        openCalc(planId) {
          this.calc = { open: true, planId: planId || '', employees: 10, loading: false, result: null };
        },

        async calculate() {
          this.calc.loading = true;
          this.calc.result = null;
          try {
            const data = await InsurePro.api('POST', '/plans/calculate', {
              plan_id: this.calc.planId,
              employees_count: this.calc.employees,
            }).catch(() => {
              const plan = this.plans.find((p) => p.id === this.calc.planId);
              return { total: (plan?.price_per_employee || 0) * this.calc.employees };
            });
            this.calc.result = data;
          } catch (err) {
            InsurePro.toast(err.message, 'error');
          } finally {
            this.calc.loading = false;
          }
        },
      };
    }

    function formatRub(v) {
      return new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB', maximumFractionDigits: 0 }).format(v || 0);
    }
  </script>
</body>
</html>
