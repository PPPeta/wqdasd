<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="InsurePro — B2B платформа ДМС. Вход в личный кабинет.">
  <title>Вход · InsurePro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/api.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-slate-100 text-slate-900 antialiased">
  <main class="min-h-screen grid place-items-center p-4">
    <section class="w-full max-w-md" x-data="loginForm()" x-cloak>
      <header class="mb-8 flex flex-col items-center gap-3">
        <span class="grid h-14 w-14 place-items-center rounded-2xl bg-blue-600 text-white text-xl font-bold shadow-lg shadow-blue-600/30">IP</span>
        <h1 class="text-3xl font-bold tracking-tight">InsurePro</h1>
        <p class="text-sm text-slate-500">B2B платформа ДМС</p>
      </header>

      <form class="card p-8 space-y-5" @submit.prevent="submit">
        <div>
          <h2 class="text-xl font-semibold">Вход в систему</h2>
          <p class="text-sm text-slate-500 mt-1">Введите email и пароль вашего аккаунта.</p>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email"
                 type="email"
                 autocomplete="email"
                 required
                 x-model.trim="email"
                 :aria-invalid="errors.email ? 'true' : 'false'"
                 aria-describedby="email-error"
                 placeholder="you@company.ru">
          <p id="email-error" class="error" x-text="errors.email" x-show="errors.email"></p>
        </div>

        <div class="field">
          <label for="password">Пароль</label>
          <div class="relative">
            <input id="password"
                   :type="showPassword ? 'text' : 'password'"
                   autocomplete="current-password"
                   required
                   x-model="password"
                   :aria-invalid="errors.password ? 'true' : 'false'"
                   aria-describedby="password-error"
                   class="pr-11">
            <button type="button"
                    @click="showPassword = !showPassword"
                    class="absolute inset-y-0 right-0 px-3 text-slate-400 hover:text-slate-700 focus-visible:text-slate-700"
                    :aria-label="showPassword ? 'Скрыть пароль' : 'Показать пароль'"
                    :aria-pressed="showPassword">
              <svg x-show="!showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              <svg x-show="showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
            </button>
          </div>
          <p id="password-error" class="error" x-text="errors.password" x-show="errors.password"></p>
        </div>

        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" x-model="remember" class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
            <span class="text-slate-600">Запомнить меня</span>
          </label>
          <a href="/forgot-password.html" class="text-blue-600 hover:underline">Забыли пароль?</a>
        </div>

        <button type="submit"
                class="btn btn-primary w-full"
                :disabled="loading">
          <svg x-show="loading" class="animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-opacity="0.25" stroke-width="4"/><path fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/></svg>
          <span x-text="loading ? 'Вход...' : 'Войти'"></span>
        </button>

        <p class="error text-center" x-show="errors.form" x-text="errors.form" role="alert"></p>
      </form>

      <p class="mt-6 text-center text-sm text-slate-600">
        Ещё нет аккаунта?
        <a href="/register.html" class="font-medium text-blue-600 hover:underline">Зарегистрировать компанию</a>
      </p>
    </section>
  </main>

  <script>
    function loginForm() {
      return {
        email: '',
        password: '',
        showPassword: false,
        remember: true,
        loading: false,
        errors: { email: '', password: '', form: '' },

        init() {
          if (window.InsurePro.auth.isAuthenticated()) {
            location.replace('/dashboard.html');
          }
        },

        validate() {
          this.errors = { email: '', password: '', form: '' };
          if (!this.email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(this.email)) {
            this.errors.email = 'Введите корректный email';
          }
          if (!this.password) {
            this.errors.password = 'Введите пароль';
          }
          return !this.errors.email && !this.errors.password;
        },

        async submit() {
          if (!this.validate()) return;
          this.loading = true;
          try {
            await window.InsurePro.auth.login(this.email, this.password);
            window.InsurePro.toast('Добро пожаловать!', 'success');
            location.href = '/dashboard.html';
          } catch (err) {
            this.errors.form = err?.message || 'Не удалось войти. Проверьте данные.';
          } finally {
            this.loading = false;
          }
        },
      };
    }
  </script>
</body>
</html>
