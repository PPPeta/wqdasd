<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дашборд · InsurePro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
  <a href="#main" class="skip-link">К содержимому</a>

  <header class="sticky top-0 z-30 bg-white border-b border-slate-200 h-16 flex items-center px-4 sm:px-6 justify-between" data-chrome-navbar></header>

  <div class="flex">
    <aside data-chrome-sidebar class="w-64 shrink-0 bg-white"></aside>
    <div data-chrome-backdrop aria-hidden="true"></div>

    <main id="main" class="flex-1 p-4 sm:p-8 max-w-full" x-data="dashboardPage()" x-init="load()">
      <div class="mb-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div>
          <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">Дашборд</h1>
          <p class="text-sm text-slate-500 mt-1" x-text="greeting"></p>
        </div>
        <button type="button" class="btn btn-secondary" @click="load(true)" :disabled="loading">
          <svg class="h-4 w-4" :class="loading && 'animate-spin'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992V4.356M2.985 19.644v-4.992h4.992M3.182 9.348a8.25 8.25 0 0113.803-3.7L19.015 7.5M20.485 14.652a8.25 8.25 0 01-13.803 3.7L3.985 16.5"/></svg>
          Обновить
        </button>
      </div>

      <!-- Widgets -->
      <section class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4 mb-8" aria-label="Ключевые показатели">
        <template x-for="w in widgets" :key="w.label">
          <div class="card p-6">
            <div class="flex items-center justify-between mb-3">
              <span class="grid h-10 w-10 place-items-center rounded-lg" :class="w.iconBg">
                <span x-html="w.icon"></span>
              </span>
              <span x-show="w.trend" class="text-xs font-medium" :class="w.trendColor" x-text="w.trend"></span>
            </div>
            <p class="text-sm text-slate-500" x-text="w.label"></p>
            <p class="text-3xl font-bold mt-1" :class="w.valueColor" x-text="loading ? '—' : w.value"></p>
          </div>
        </template>
      </section>

      <!-- Charts (admin) -->
      <section x-show="isAdmin" class="grid gap-6 lg:grid-cols-2 mb-8">
        <div class="card p-6">
          <h2 class="font-semibold mb-4">Полисы по статусам</h2>
          <div class="relative h-64"><canvas id="chartStatuses" aria-label="Полисы по статусам"></canvas></div>
        </div>
        <div class="card p-6">
          <h2 class="font-semibold mb-4">Выручка по месяцам</h2>
          <div class="relative h-64"><canvas id="chartRevenue" aria-label="Выручка по месяцам"></canvas></div>
        </div>
      </section>

      <!-- Recent claims (manager/admin) -->
      <section x-show="isManager || isAdmin" class="grid gap-6 lg:grid-cols-2 mb-8">
        <div class="card overflow-hidden">
          <header class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
            <h2 class="font-semibold">Последние обращения</h2>
            <a href="/claims.html" class="text-sm text-blue-600 hover:underline">Все →</a>
          </header>
          <ul class="divide-y divide-slate-100">
            <template x-for="c in recentClaims" :key="c.id">
              <li class="px-6 py-4 flex items-center justify-between gap-3">
                <div class="min-w-0 flex-1">
                  <p class="font-medium truncate" x-text="c.title"></p>
                  <p class="text-xs text-slate-500 mt-0.5" x-text="c.meta"></p>
                </div>
                <span class="badge" :class="`badge-${c.status}`" x-text="c.statusLabel"></span>
              </li>
            </template>
            <li x-show="!recentClaims.length && !loading" class="px-6 py-10 text-center text-sm text-slate-400">Пока нет обращений</li>
          </ul>
        </div>

        <div class="card overflow-hidden">
          <header class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
            <h2 class="font-semibold">Полисы истекают в 30 дней</h2>
            <a href="/policies.html" class="text-sm text-blue-600 hover:underline">Все →</a>
          </header>
          <ul class="divide-y divide-slate-100">
            <template x-for="p in expiringPolicies" :key="p.id">
              <li class="px-6 py-4 flex items-center justify-between gap-3">
                <div class="min-w-0 flex-1">
                  <p class="font-medium truncate" x-text="p.number"></p>
                  <p class="text-xs text-slate-500 mt-0.5" x-text="p.company"></p>
                </div>
                <span class="text-xs font-medium text-amber-700" x-text="p.expiresIn"></span>
              </li>
            </template>
            <li x-show="!expiringPolicies.length && !loading" class="px-6 py-10 text-center text-sm text-slate-400">Истекающих полисов нет</li>
          </ul>
        </div>
      </section>

      <!-- Employee view -->
      <section x-show="isEmployee" class="card p-6 sm:p-8">
        <div class="flex items-start justify-between gap-4 flex-wrap">
          <div>
            <p class="text-xs uppercase tracking-wider text-slate-500">Мой активный полис</p>
            <h2 class="text-2xl font-bold mt-1" x-text="myPolicy.plan || '—'"></h2>
            <p class="text-sm text-slate-500" x-text="myPolicy.period || 'Нет активного полиса'"></p>
          </div>
          <a href="/claims.html?new=1" class="btn btn-primary">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
            Подать обращение
          </a>
        </div>
        <dl class="grid gap-4 sm:grid-cols-3 mt-6">
          <template x-for="cov in myPolicy.coverages || []" :key="cov.name">
            <div class="rounded-xl bg-slate-50 p-4">
              <dt class="text-xs uppercase tracking-wider text-slate-500" x-text="cov.name"></dt>
              <dd class="mt-1 font-semibold" x-text="cov.limit"></dd>
            </div>
          </template>
        </dl>
      </section>
    </main>
  </div>

  <script>
    InsurePro.mountChrome('dashboard');

    function dashboardPage() {
      return {
        loading: true,
        widgets: [],
        recentClaims: [],
        expiringPolicies: [],
        myPolicy: {},
        charts: {},

        get user() { return InsurePro.auth.user() || {}; },
        get isAdmin() { return this.user.role === 'admin'; },
        get isManager() { return this.user.role === 'company_manager'; },
        get isEmployee() { return this.user.role === 'employee'; },

        get greeting() {
          const hour = new Date().getHours();
          const name = this.user.first_name || this.user.firstName || '';
          const t = hour < 6 ? 'Доброй ночи' : hour < 12 ? 'Доброе утро' : hour < 18 ? 'Добрый день' : 'Добрый вечер';
          return name ? `${t}, ${name}!` : t + '!';
        },

        async load(force = false) {
          this.loading = true;
          try {
            const role = this.user.role;
            // Fallback placeholders when API returns nothing — keeps UI alive during dev.
            const data = await InsurePro.api('GET', `/dashboard/?role=${role}`).catch(() => null) || this.fallback();
            this.widgets = this.buildWidgets(role, data);
            this.recentClaims = (data.recent_claims || []).slice(0, 5).map(this.mapClaim);
            this.expiringPolicies = (data.expiring_policies || []).slice(0, 5).map((p) => ({
              id: p.id, number: p.number || `№${p.id}`,
              company: p.company_name || '', expiresIn: `${p.expires_in_days || 0} дн.`,
            }));
            this.myPolicy = data.my_policy || {};
            if (this.isAdmin) this.$nextTick(() => this.renderCharts(data));
          } catch (err) {
            InsurePro.toast('Не удалось загрузить данные', 'error');
          } finally {
            this.loading = false;
          }
        },

        fallback() {
          return {
            widgets: {},
            recent_claims: [],
            expiring_policies: [],
            my_policy: {},
            statuses: { active: 0, draft: 0, suspended: 0, cancelled: 0 },
            revenue: [],
          };
        },

        mapClaim(c) {
          const labels = {
            pending: 'В ожидании', approved: 'Одобрено', rejected: 'Отклонено',
            active: 'Активно', draft: 'Черновик',
          };
          return {
            id: c.id,
            title: c.title || `Обращение №${c.id}`,
            meta: [c.type_label, c.employee_name, c.created_at].filter(Boolean).join(' · '),
            status: c.status || 'pending',
            statusLabel: labels[c.status] || c.status,
          };
        },

        buildWidgets(role, data) {
          const w = data.widgets || {};
          const icon = (path, bg) => `<svg class="h-5 w-5 ${bg.replace('bg-', 'text-').replace('100', '600')}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">${path}</svg>`;

          if (role === 'admin') {
            return [
              { label: 'Всего компаний', value: w.companies ?? 0, iconBg: 'bg-blue-100', valueColor: 'text-blue-700',
                icon: icon('<path stroke-linecap="round" stroke-linejoin="round" d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h1.5m-1.5 3h1.5m-1.5 3h1.5m3-6H15m-1.5 3H15m-1.5 3H15M9 21v-3.375c0-.621.504-1.125 1.125-1.125h3.75c.621 0 1.125.504 1.125 1.125V21"/>', 'bg-blue-100'),
                trend: w.companies_trend, trendColor: 'text-green-600' },
              { label: 'Всего полисов', value: w.policies ?? 0, iconBg: 'bg-indigo-100', valueColor: 'text-indigo-700',
                icon: icon('<path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>', 'bg-indigo-100'),
                trend: w.policies_trend, trendColor: 'text-green-600' },
              { label: 'Обращений', value: w.claims ?? 0, iconBg: 'bg-amber-100', valueColor: 'text-amber-700',
                icon: icon('<path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 01-1.043 3.296 3.745 3.745 0 01-3.296 1.043A3.745 3.745 0 0112 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 01-3.296-1.043 3.745 3.745 0 01-1.043-3.296A3.745 3.745 0 013 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 011.043-3.296 3.746 3.746 0 013.296-1.043A3.746 3.746 0 0112 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 013.296 1.043 3.746 3.746 0 011.043 3.296A3.745 3.745 0 0121 12z"/>', 'bg-amber-100'),
                trend: w.claims_trend, trendColor: 'text-amber-600' },
              { label: 'Выручка', value: formatCurrency(w.revenue ?? 0), iconBg: 'bg-green-100', valueColor: 'text-green-700',
                icon: icon('<path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m-3-2.818l.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-2.03 0-3.75-1.006-3.75-2.25S9.97 7.5 12 7.5c.768 0 1.536.219 2.121.659L15 8.818m3 3.182a9 9 0 11-18 0 9 9 0 0118 0z"/>', 'bg-green-100'),
                trend: w.revenue_trend, trendColor: 'text-green-600' },
            ];
          }
          if (role === 'company_manager') {
            return [
              { label: 'Сотрудников', value: w.employees ?? 0, iconBg: 'bg-blue-100', valueColor: 'text-blue-700',
                icon: icon('<path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z"/>', 'bg-blue-100') },
              { label: 'Активных полисов', value: w.active_policies ?? 0, iconBg: 'bg-green-100', valueColor: 'text-green-700',
                icon: icon('<path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/>', 'bg-green-100') },
              { label: 'Обращений в ожидании', value: w.pending_claims ?? 0, iconBg: 'bg-amber-100', valueColor: 'text-amber-700',
                icon: icon('<path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/>', 'bg-amber-100') },
              { label: 'Истекают в 30 дней', value: w.expiring ?? 0, iconBg: 'bg-red-100', valueColor: 'text-red-700',
                icon: icon('<path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>', 'bg-red-100') },
            ];
          }
          return [
            { label: 'Мои полисы', value: w.my_policies ?? 0, iconBg: 'bg-blue-100', valueColor: 'text-blue-700',
              icon: icon('<path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/>', 'bg-blue-100') },
            { label: 'Мои обращения', value: w.my_claims ?? 0, iconBg: 'bg-amber-100', valueColor: 'text-amber-700',
              icon: icon('<path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>', 'bg-amber-100') },
          ];
        },

        renderCharts(data) {
          Object.values(this.charts).forEach((c) => c?.destroy?.());
          const statusesEl = document.getElementById('chartStatuses');
          const revenueEl = document.getElementById('chartRevenue');
          if (statusesEl) {
            const s = data.statuses || { active: 12, draft: 3, suspended: 2, cancelled: 1 };
            this.charts.statuses = new Chart(statusesEl, {
              type: 'doughnut',
              data: {
                labels: ['Активные', 'Черновики', 'Приостановлены', 'Отменены'],
                datasets: [{
                  data: [s.active, s.draft, s.suspended, s.cancelled],
                  backgroundColor: ['#22c55e', '#94a3b8', '#f59e0b', '#ef4444'],
                  borderWidth: 0,
                }],
              },
              options: { plugins: { legend: { position: 'bottom' } }, cutout: '65%' },
            });
          }
          if (revenueEl) {
            const r = data.revenue && data.revenue.length ? data.revenue : [
              { month: 'Янв', value: 240 }, { month: 'Фев', value: 310 }, { month: 'Мар', value: 280 },
              { month: 'Апр', value: 360 }, { month: 'Май', value: 420 }, { month: 'Июн', value: 480 },
            ];
            this.charts.revenue = new Chart(revenueEl, {
              type: 'line',
              data: {
                labels: r.map((x) => x.month),
                datasets: [{
                  data: r.map((x) => x.value),
                  borderColor: '#2563eb',
                  backgroundColor: 'rgba(37, 99, 235, 0.1)',
                  fill: true,
                  tension: 0.35,
                  pointRadius: 4,
                }],
              },
              options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } },
            });
          }
        },
      };
    }

    function formatCurrency(v) {
      return new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB', maximumFractionDigits: 0 }).format(v);
    }
  </script>
</body>
</html>
