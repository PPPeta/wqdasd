<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Полис · InsurePro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
  <a href="#main" class="skip-link">К содержимому</a>
  <header class="sticky top-0 z-30 bg-white border-b border-slate-200 h-16 flex items-center px-4 sm:px-6 justify-between" data-chrome-navbar></header>
  <div class="flex">
    <aside data-chrome-sidebar class="w-64 shrink-0 bg-white"></aside>
    <div data-chrome-backdrop aria-hidden="true"></div>

    <main id="main" class="flex-1 p-4 sm:p-8 max-w-full" x-data="policyPage()" x-init="load()">
      <nav class="mb-6 text-sm" aria-label="Хлебные крошки">
        <a href="/policies.html" class="text-slate-500 hover:text-slate-700">Полисы</a>
        <span class="mx-2 text-slate-400">/</span>
        <span class="text-slate-900 font-medium" x-text="policy.number || '...'"></span>
      </nav>

      <div x-show="!loading && policy.id" x-cloak>
        <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
          <div>
            <h1 class="text-2xl sm:text-3xl font-bold" x-text="`Полис ${policy.number || policy.id}`"></h1>
            <p class="text-sm text-slate-500 mt-1" x-text="policy.plan_name"></p>
          </div>
          <div class="flex items-center gap-3">
            <span class="badge" :class="`badge-${policy.status}`" x-text="statusLabel"></span>
            <button type="button" class="btn btn-secondary">
              <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/></svg>
              Скачать PDF
            </button>
          </div>
        </header>

        <div class="grid lg:grid-cols-3 gap-6">
          <section class="card p-6 lg:col-span-2">
            <h2 class="font-semibold mb-4">Реквизиты</h2>
            <dl class="grid sm:grid-cols-2 gap-4">
              <div><dt class="text-xs text-slate-500 uppercase">Компания</dt><dd class="mt-1 font-medium" x-text="policy.company_name"></dd></div>
              <div><dt class="text-xs text-slate-500 uppercase">План</dt><dd class="mt-1 font-medium" x-text="policy.plan_name"></dd></div>
              <div><dt class="text-xs text-slate-500 uppercase">Начало действия</dt><dd class="mt-1" x-text="formatDate(policy.start_date)"></dd></div>
              <div><dt class="text-xs text-slate-500 uppercase">Окончание</dt><dd class="mt-1" x-text="formatDate(policy.end_date)"></dd></div>
              <div><dt class="text-xs text-slate-500 uppercase">Сотрудников</dt><dd class="mt-1 font-medium" x-text="policy.employees_count || 0"></dd></div>
              <div><dt class="text-xs text-slate-500 uppercase">Ежемесячно</dt><dd class="mt-1 font-semibold text-blue-700" x-text="formatRub(policy.monthly_cost)"></dd></div>
            </dl>
          </section>

          <aside class="card p-6">
            <h2 class="font-semibold mb-4">Управление</h2>
            <div class="flex flex-col gap-2">
              <button type="button" class="btn btn-primary" x-show="policy.status === 'draft'">Активировать</button>
              <button type="button" class="btn btn-secondary" x-show="policy.status === 'active'">Приостановить</button>
              <button type="button" class="btn btn-secondary" x-show="policy.status === 'suspended'">Возобновить</button>
              <button type="button" class="btn btn-danger" x-show="['active','suspended','draft'].includes(policy.status)">Отменить</button>
            </div>
          </aside>

          <section class="card p-6 lg:col-span-3">
            <h2 class="font-semibold mb-4">Покрытия</h2>
            <ul class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
              <template x-for="c in coverages" :key="c.name">
                <li class="rounded-xl bg-slate-50 p-4">
                  <p class="font-medium" x-text="c.name"></p>
                  <p class="text-sm text-slate-500 mt-1" x-text="c.limit"></p>
                </li>
              </template>
            </ul>
          </section>

          <section class="card overflow-hidden lg:col-span-3">
            <header class="px-6 py-4 border-b border-slate-100">
              <h2 class="font-semibold">История изменений</h2>
            </header>
            <table class="data-table">
              <thead><tr><th>Дата</th><th>Событие</th><th>Автор</th></tr></thead>
              <tbody>
                <template x-for="h in history" :key="h.id">
                  <tr>
                    <td class="text-slate-500 text-sm" x-text="formatDateTime(h.created_at)"></td>
                    <td x-text="h.action"></td>
                    <td class="text-slate-600 text-sm" x-text="h.actor"></td>
                  </tr>
                </template>
                <tr x-show="!history.length">
                  <td colspan="3" class="text-center text-slate-400 py-8">Записей пока нет</td>
                </tr>
              </tbody>
            </table>
          </section>
        </div>
      </div>

      <div x-show="loading" class="space-y-4">
        <div class="skeleton h-10 w-1/3"></div>
        <div class="skeleton h-64"></div>
      </div>
    </main>
  </div>

  <script>
    InsurePro.mountChrome('policies');

    const STATUS_LABELS = { draft: 'Черновик', active: 'Активен', suspended: 'Приостановлен', cancelled: 'Отменён', expired: 'Истёк' };

    function policyPage() {
      return {
        loading: true,
        policy: {},
        coverages: [],
        history: [],

        get statusLabel() { return STATUS_LABELS[this.policy.status] || this.policy.status; },

        async load() {
          const id = new URLSearchParams(location.search).get('id');
          if (!id) {
            InsurePro.toast('Не указан ID полиса', 'error');
            location.href = '/policies.html';
            return;
          }
          try {
            const data = await InsurePro.api('GET', `/policies/${id}/`);
            this.policy = data;
            this.coverages = data.coverages || [];
            this.history = data.history || [];
          } catch (err) {
            InsurePro.toast(err.message, 'error');
          } finally {
            this.loading = false;
          }
        },

        formatDate(d) { return d ? new Date(d).toLocaleDateString('ru-RU') : '—'; },
        formatDateTime(d) { return d ? new Date(d).toLocaleString('ru-RU') : '—'; },
      };
    }

    function formatRub(v) {
      return new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB', maximumFractionDigits: 0 }).format(v || 0);
    }
  </script>
</body>
</html>
