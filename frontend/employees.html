<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сотрудники · InsurePro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
  <a href="#main" class="skip-link">К содержимому</a>
  <header class="sticky top-0 z-30 bg-white border-b border-slate-200 h-16 flex items-center px-4 sm:px-6 justify-between" data-chrome-navbar></header>
  <div class="flex">
    <aside data-chrome-sidebar class="w-64 shrink-0 bg-white"></aside>
    <div data-chrome-backdrop aria-hidden="true"></div>

    <main id="main" class="flex-1 p-4 sm:p-8 max-w-full" x-data="employeesPage()" x-init="load()">
      <header class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div>
          <h1 class="text-2xl sm:text-3xl font-bold">Сотрудники</h1>
          <p class="text-sm text-slate-500 mt-1">Всего: <span x-text="total"></span></p>
        </div>
        <button type="button" class="btn btn-primary" @click="openModal()">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          Добавить сотрудника
        </button>
      </header>

      <div class="card p-4 mb-6 flex flex-col sm:flex-row gap-3">
        <div class="relative flex-1">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
          <input type="search"
                 placeholder="Поиск по имени или email..."
                 class="w-full pl-10 pr-3 py-2.5 rounded-lg border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none"
                 x-model.debounce.300ms="query"
                 @input="load()">
        </div>
        <select class="rounded-lg border border-slate-200 px-3 py-2.5" x-model="filter" @change="load()">
          <option value="all">Все сотрудники</option>
          <option value="active">Активные</option>
          <option value="inactive">Деактивированные</option>
        </select>
      </div>

      <div class="card overflow-hidden">
        <div class="overflow-x-auto">
          <table class="data-table">
            <thead>
              <tr>
                <th>Имя</th>
                <th>Email</th>
                <th>Статус</th>
                <th>Полисы</th>
                <th class="text-right">Действия</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="emp in employees" :key="emp.id">
                <tr>
                  <td>
                    <div class="flex items-center gap-3">
                      <span class="grid h-9 w-9 place-items-center rounded-full bg-blue-100 text-blue-700 font-semibold text-sm" x-text="initials(emp)"></span>
                      <span class="font-medium" x-text="fullName(emp)"></span>
                    </div>
                  </td>
                  <td class="text-slate-600" x-text="emp.email"></td>
                  <td><span class="badge" :class="emp.is_active ? 'badge-active' : 'badge-cancelled'" x-text="emp.is_active ? 'Активен' : 'Деактивирован'"></span></td>
                  <td x-text="emp.policies_count ?? 0"></td>
                  <td class="text-right">
                    <div class="inline-flex gap-2">
                      <button type="button" class="btn btn-ghost px-3 py-1.5 text-sm" @click="edit(emp)">Изменить</button>
                      <button type="button"
                              class="btn btn-ghost px-3 py-1.5 text-sm"
                              :class="emp.is_active ? 'text-red-600 hover:bg-red-50' : 'text-green-600 hover:bg-green-50'"
                              @click="toggleActive(emp)"
                              x-text="emp.is_active ? 'Деактивировать' : 'Активировать'"></button>
                    </div>
                  </td>
                </tr>
              </template>
              <tr x-show="!loading && !employees.length">
                <td colspan="5" class="text-center text-slate-400 py-12">
                  <p class="text-lg font-medium">Сотрудники не найдены</p>
                  <p class="text-sm mt-1">Попробуйте изменить фильтры или добавить нового сотрудника</p>
                </td>
              </tr>
              <template x-if="loading">
                <tr><td colspan="5"><div class="skeleton h-10 my-3"></div></td></tr>
              </template>
            </tbody>
          </table>
        </div>

        <nav x-show="pages > 1" class="flex items-center justify-between px-4 py-3 border-t border-slate-100" aria-label="Пагинация">
          <p class="text-sm text-slate-500">Стр. <span x-text="page"></span> из <span x-text="pages"></span></p>
          <div class="flex gap-1">
            <button type="button" class="btn btn-ghost px-3 py-1.5 text-sm" :disabled="page === 1" @click="page--; load()">←</button>
            <button type="button" class="btn btn-ghost px-3 py-1.5 text-sm" :disabled="page >= pages" @click="page++; load()">→</button>
          </div>
        </nav>
      </div>

      <!-- Modal -->
      <div x-show="modal.open"
           x-transition.opacity
           class="fixed inset-0 z-50 grid place-items-center bg-slate-900/60 p-4"
           @keydown.escape.window="closeModal()"
           role="dialog"
           aria-modal="true"
           aria-labelledby="modal-title">
        <div class="card w-full max-w-md p-6" @click.stop>
          <header class="flex items-center justify-between mb-4">
            <h2 id="modal-title" class="text-lg font-semibold" x-text="modal.mode === 'edit' ? 'Редактировать сотрудника' : 'Новый сотрудник'"></h2>
            <button type="button" class="p-1 rounded-lg hover:bg-slate-100" @click="closeModal()" aria-label="Закрыть">
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </header>
          <form @submit.prevent="save()" class="space-y-4">
            <div class="field">
              <label for="em-email">Email</label>
              <input id="em-email" type="email" required x-model.trim="modal.data.email">
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div class="field">
                <label for="em-first">Имя</label>
                <input id="em-first" required x-model.trim="modal.data.first_name">
              </div>
              <div class="field">
                <label for="em-last">Фамилия</label>
                <input id="em-last" required x-model.trim="modal.data.last_name">
              </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" class="btn btn-secondary" @click="closeModal()">Отмена</button>
              <button type="submit" class="btn btn-primary" :disabled="modal.saving" x-text="modal.saving ? 'Сохранение...' : 'Сохранить'"></button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script>
    InsurePro.mountChrome('employees');

    function employeesPage() {
      return {
        employees: [], total: 0, loading: false,
        page: 1, pages: 1, pageSize: 10,
        query: '', filter: 'all',
        modal: { open: false, mode: 'create', saving: false, data: {} },

        async load() {
          this.loading = true;
          try {
            const params = new URLSearchParams({
              page: this.page, page_size: this.pageSize,
              ...(this.query && { search: this.query }),
              ...(this.filter !== 'all' && { is_active: this.filter === 'active' }),
            });
            const data = await InsurePro.api('GET', `/employees/?${params}`).catch(() => ({ results: [], count: 0 }));
            this.employees = data.results || data || [];
            this.total = data.count ?? this.employees.length;
            this.pages = Math.max(1, Math.ceil(this.total / this.pageSize));
          } catch (err) {
            InsurePro.toast(err.message, 'error');
          } finally {
            this.loading = false;
          }
        },

        initials(e) { return ((e.first_name || '?').charAt(0) + (e.last_name || '').charAt(0)).toUpperCase(); },
        fullName(e) { return `${e.first_name || ''} ${e.last_name || ''}`.trim() || e.email; },

        openModal() { this.modal = { open: true, mode: 'create', saving: false, data: { email: '', first_name: '', last_name: '' } }; },
        edit(emp) { this.modal = { open: true, mode: 'edit', saving: false, data: { ...emp } }; },
        closeModal() { this.modal.open = false; },

        async save() {
          this.modal.saving = true;
          try {
            const method = this.modal.mode === 'edit' ? 'PATCH' : 'POST';
            const url = this.modal.mode === 'edit' ? `/employees/${this.modal.data.id}/` : '/employees/';
            await InsurePro.api(method, url, this.modal.data);
            InsurePro.toast('Сотрудник сохранён', 'success');
            this.closeModal();
            this.load();
          } catch (err) {
            InsurePro.toast(err.message, 'error');
          } finally {
            this.modal.saving = false;
          }
        },

        async toggleActive(emp) {
          if (!confirm(emp.is_active ? 'Деактивировать сотрудника?' : 'Активировать сотрудника?')) return;
          try {
            await InsurePro.api('PATCH', `/employees/${emp.id}/`, { is_active: !emp.is_active });
            InsurePro.toast('Статус обновлён', 'success');
            this.load();
          } catch (err) {
            InsurePro.toast(err.message, 'error');
          }
        },
      };
    }
  </script>
</body>
</html>
