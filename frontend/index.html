<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InsurePro</title>
  <script src="/js/api.js"></script>
  <script>
    // Route guard: authenticated users go to dashboard, others to login.
    (function () {
      const { auth } = window.InsurePro;
      location.replace(auth.isAuthenticated() ? '/dashboard.html' : '/login.html');
    })();
  </script>
</head>
<body>
  <noscript>Для работы InsurePro необходим JavaScript.</noscript>
</body>
</html>
