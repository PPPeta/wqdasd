<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Полисы · InsurePro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
  <a href="#main" class="skip-link">К содержимому</a>
  <header class="sticky top-0 z-30 bg-white border-b border-slate-200 h-16 flex items-center px-4 sm:px-6 justify-between" data-chrome-navbar></header>
  <div class="flex">
    <aside data-chrome-sidebar class="w-64 shrink-0 bg-white"></aside>
    <div data-chrome-backdrop aria-hidden="true"></div>

    <main id="main" class="flex-1 p-4 sm:p-8 max-w-full" x-data="policiesPage()" x-init="load()">
      <header class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div>
          <h1 class="text-2xl sm:text-3xl font-bold">Полисы</h1>
          <p class="text-sm text-slate-500 mt-1">Управление страховыми полисами</p>
        </div>
        <button type="button" x-show="$store.auth.hasRole('admin', 'company_manager')" class="btn btn-primary">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          Новый полис
        </button>
      </header>

      <div class="card p-3 mb-6 flex gap-2 overflow-x-auto" role="tablist" aria-label="Фильтр по статусу">
        <template x-for="f in filters" :key="f.value">
          <button type="button"
                  role="tab"
                  :aria-selected="filter === f.value"
                  class="px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap transition-colors"
                  :class="filter === f.value ? 'bg-blue-600 text-white' : 'text-slate-600 hover:bg-slate-100'"
                  @click="filter = f.value; load()"
                  x-text="`${f.label} ${f.count ? '· ' + f.count : ''}`"></button>
        </template>
      </div>

      <div class="card overflow-hidden">
        <div class="overflow-x-auto">
          <table class="data-table">
            <thead>
              <tr>
                <th>Номер</th>
                <th>Компания</th>
                <th>План</th>
                <th>Статус</th>
                <th>Начало</th>
                <th>Конец</th>
                <th class="text-right">Действия</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="p in policies" :key="p.id">
                <tr>
                  <td class="font-mono text-sm" x-text="p.number || `POL-${p.id}`"></td>
                  <td class="font-medium" x-text="p.company_name || '—'"></td>
                  <td class="text-slate-600" x-text="p.plan_name || '—'"></td>
                  <td><span class="badge" :class="`badge-${p.status}`" x-text="statusLabel(p.status)"></span></td>
                  <td class="text-slate-600 text-sm" x-text="formatDate(p.start_date)"></td>
                  <td class="text-slate-600 text-sm" x-text="formatDate(p.end_date)"></td>
                  <td class="text-right">
                    <a :href="`/policy.html?id=${p.id}`" class="text-blue-600 hover:underline text-sm font-medium">Открыть →</a>
                  </td>
                </tr>
              </template>
              <tr x-show="!loading && !policies.length">
                <td colspan="7" class="text-center text-slate-400 py-12">Полисы не найдены</td>
              </tr>
              <template x-if="loading">
                <tr><td colspan="7"><div class="skeleton h-10 my-3"></div></td></tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    InsurePro.mountChrome('policies');

    const STATUS_LABELS = {
      draft: 'Черновик', active: 'Активен', suspended: 'Приостановлен',
      cancelled: 'Отменён', expired: 'Истёк',
    };

    function policiesPage() {
      return {
        policies: [], loading: false,
        filter: 'all',
        filters: [
          { value: 'all', label: 'Все' },
          { value: 'active', label: 'Активные' },
          { value: 'draft', label: 'Черновики' },
          { value: 'suspended', label: 'Приостановлены' },
          { value: 'cancelled', label: 'Отменены' },
          { value: 'expired', label: 'Истёкшие' },
        ],

        async load() {
          this.loading = true;
          try {
            const qs = this.filter === 'all' ? '' : `?status=${this.filter}`;
            const data = await InsurePro.api('GET', `/policies/${qs}`).catch(() => ({ results: [] }));
            this.policies = data.results || data || [];
          } catch (err) {
            InsurePro.toast(err.message, 'error');
          } finally {
            this.loading = false;
          }
        },

        statusLabel(s) { return STATUS_LABELS[s] || s; },
        formatDate(d) { return d ? new Date(d).toLocaleDateString('ru-RU') : '—'; },
      };
    }
  </script>
</body>
</html>
