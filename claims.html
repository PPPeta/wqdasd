<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заявки — InsurePro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
</head>
<body class="bg-gray-50">

  <main x-data="claimsApp()" x-init="init()" x-cloak>
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">Заявки</h1>
        <p class="text-sm text-slate-500 mt-1">Страховые случаи и обращения</p>
      </div>
      <button class="btn btn-primary" @click="openNewClaim()">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
        Новая заявка
      </button>
    </div>

    <!-- Status filter tabs -->
    <div class="flex flex-wrap gap-2 mb-6" role="tablist" aria-label="Фильтр по статусу">
      <template x-for="tab in tabs" :key="tab.value">
        <button
          class="px-4 py-2 rounded-lg text-sm font-medium transition"
          :class="activeTab === tab.value ? 'bg-blue-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
          @click="activeTab = tab.value; loadClaims()"
          role="tab"
          :aria-selected="activeTab === tab.value"
          x-text="tab.label"
        ></button>
      </template>
    </div>

    <!-- Table -->
    <div class="card overflow-hidden">
      <div class="overflow-x-auto">
        <table class="data-table">
          <thead>
            <tr>
              <th>№</th>
              <th>Тип</th>
              <th>Сотрудник</th>
              <th>Дата</th>
              <th>Сумма</th>
              <th>Статус</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <template x-for="claim in claims" :key="claim.id">
              <tr>
                <td class="font-medium" x-text="'#' + claim.id"></td>
                <td x-text="claim.type"></td>
                <td x-text="claim.employee"></td>
                <td class="text-slate-500 text-sm" x-text="claim.date"></td>
                <td class="font-medium" x-text="formatCurrency(claim.amount)"></td>
                <td>
                  <span class="badge" :class="'badge-' + claim.status" x-text="statusLabels[claim.status]"></span>
                </td>
                <td class="text-right">
                  <a :href="'/claim.html?id=' + claim.id" class="text-blue-600 hover:text-blue-800 text-sm font-medium">Подробнее</a>
                </td>
              </tr>
            </template>
            <tr x-show="claims.length === 0">
              <td colspan="7" class="text-center text-slate-400 py-8">Заявки не найдены</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- New Claim Modal -->
    <div x-show="showModal" x-transition.opacity class="fixed inset-0 z-50 flex items-center justify-center p-4" style="display:none;">
      <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" @click="showModal = false"></div>
      <div class="relative w-full max-w-lg card p-6 max-h-[90vh] overflow-y-auto">
        <h2 class="text-lg font-semibold text-slate-800 mb-5">Новая заявка</h2>

        <form @submit.prevent="submitClaim" novalidate>
          <div class="field mb-4">
            <label for="claim-type">Тип обращения</label>
            <select id="claim-type" x-model="form.type" :aria-invalid="formErrors.type ? 'true' : 'false'">
              <option value="">Выберите тип</option>
              <option value="ambulatory">Амбулаторное лечение</option>
              <option value="hospitalization">Госпитализация</option>
              <option value="dental">Стоматология</option>
              <option value="optics">Офтальмология</option>
              <option value="rehabilitation">Реабилитация</option>
              <option value="other">Другое</option>
            </select>
            <span class="error" x-show="formErrors.type" x-text="formErrors.type"></span>
          </div>

          <div class="field mb-4">
            <label for="claim-description">Описание</label>
            <textarea id="claim-description" x-model="form.description" rows="3" :aria-invalid="formErrors.description ? 'true' : 'false'" placeholder="Опишите ситуацию..."></textarea>
            <span class="error" x-show="formErrors.description" x-text="formErrors.description"></span>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
            <div class="field">
              <label for="claim-date">Дата события</label>
              <input type="date" id="claim-date" x-model="form.date" :aria-invalid="formErrors.date ? 'true' : 'false'">
              <span class="error" x-show="formErrors.date" x-text="formErrors.date"></span>
            </div>
            <div class="field">
              <label for="claim-place">Место</label>
              <input type="text" id="claim-place" x-model="form.place" placeholder="Город, клиника">
            </div>
          </div>

          <div class="field mb-4">
            <label for="claim-amount">Сумма (₽)</label>
            <input type="number" id="claim-amount" x-model.number="form.amount" :aria-invalid="formErrors.amount ? 'true' : 'false'" placeholder="0" min="0">
            <span class="error" x-show="formErrors.amount" x-text="formErrors.amount"></span>
          </div>

          <div class="field mb-6">
            <label for="claim-files">Документы</label>
            <div class="border-2 border-dashed border-slate-200 rounded-lg p-4 text-center hover:border-blue-300 transition cursor-pointer" @click="$refs.fileInput.click()">
              <svg class="w-8 h-8 text-slate-400 mx-auto mb-2" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/></svg>
              <p class="text-sm text-slate-500">Нажмите для загрузки файлов</p>
              <p class="text-xs text-slate-400 mt-1">PDF, JPG, PNG до 10 МБ</p>
            </div>
            <input type="file" x-ref="fileInput" multiple accept=".pdf,.jpg,.jpeg,.png" class="hidden" @change="handleFiles($event)">
            <div class="mt-2 space-y-1">
              <template x-for="(file, idx) in form.files" :key="idx">
                <div class="flex items-center justify-between bg-slate-50 rounded px-3 py-1.5 text-sm">
                  <span class="text-slate-600 truncate" x-text="file.name"></span>
                  <button type="button" class="text-red-500 hover:text-red-700 ml-2" @click="form.files.splice(idx, 1)">×</button>
                </div>
              </template>
            </div>
          </div>

          <div class="flex justify-end gap-3">
            <button type="button" class="btn btn-secondary" @click="showModal = false">Отмена</button>
            <button type="submit" class="btn btn-primary" :disabled="saving">
              <span x-text="saving ? 'Отправка...' : 'Отправить заявку'"></span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script>
    function claimsApp() {
      return {
        claims: [],
        activeTab: 'all',
        tabs: [
          { value: 'all', label: 'Все' },
          { value: 'pending', label: 'На рассмотрении' },
          { value: 'reviewing', label: 'Рассматривается' },
          { value: 'approved', label: 'Одобрены' },
          { value: 'rejected', label: 'Отклонены' }
        ],
        statusLabels: {
          pending: 'На рассмотрении',
          reviewing: 'Рассматривается',
          approved: 'Одобрена',
          rejected: 'Отклонена'
        },
        showModal: false,
        form: { type: '', description: '', date: '', place: '', amount: null, files: [] },
        formErrors: {},
        saving: false,

        formatCurrency(val) {
          return window.InsurePro.formatCurrency(val || 0);
        },

        async init() {
          window.InsurePro.mountChrome('claims');
          await this.loadClaims();
        },

        async loadClaims() {
          try {
            const params = new URLSearchParams();
            if (this.activeTab !== 'all') params.set('status', this.activeTab);
            const data = await window.InsurePro.apiFetch(`/claims/?${params}`);
            this.claims = data.results || data;
          } catch {
            this.claims = this.getDemo();
          }
        },

        getDemo() {
          const all = [
            { id: 501, type: 'Амбулаторное лечение', employee: 'Иванов И.И.', date: '15.01.2025', amount: 12500, status: 'pending' },
            { id: 502, type: 'Стоматология', employee: 'Петрова А.С.', date: '10.01.2025', amount: 35000, status: 'approved' },
            { id: 503, type: 'Госпитализация', employee: 'Сидоров В.К.', date: '05.01.2025', amount: 85000, status: 'reviewing' },
            { id: 504, type: 'Офтальмология', employee: 'Козлова М.А.', date: '28.12.2024', amount: 8000, status: 'approved' },
            { id: 505, type: 'Реабилитация', employee: 'Новиков Д.О.', date: '20.12.2024', amount: 45000, status: 'rejected' }
          ];
          if (this.activeTab === 'all') return all;
          return all.filter(c => c.status === this.activeTab);
        },

        openNewClaim() {
          this.form = { type: '', description: '', date: '', place: '', amount: null, files: [] };
          this.formErrors = {};
          this.showModal = true;
        },

        handleFiles(event) {
          const files = Array.from(event.target.files);
          this.form.files = [...this.form.files, ...files];
        },

        async submitClaim() {
          this.formErrors = {};
          if (!this.form.type) this.formErrors.type = 'Выберите тип обращения';
          if (!this.form.description.trim()) this.formErrors.description = 'Заполните описание';
          if (!this.form.date) this.formErrors.date = 'Укажите дату';
          if (!this.form.amount || this.form.amount <= 0) this.formErrors.amount = 'Укажите сумму';
          if (Object.keys(this.formErrors).length) return;

          this.saving = true;
          try {
            const formData = new FormData();
            formData.append('type', this.form.type);
            formData.append('description', this.form.description);
            formData.append('date', this.form.date);
            formData.append('place', this.form.place);
            formData.append('amount', this.form.amount);
            this.form.files.forEach(f => formData.append('documents', f));

            await window.InsurePro.apiFetch('/claims/', { method: 'POST', body: formData });
            window.InsurePro.toast('Заявка отправлена', 'success');
            this.showModal = false;
            await this.loadClaims();
          } catch (err) {
            window.InsurePro.toast(err.message || 'Ошибка отправки', 'error');
          } finally {
            this.saving = false;
          }
        }
      };
    }
  </script>
</body>
</html>
