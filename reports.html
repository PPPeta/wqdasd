<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Отчёты — InsurePro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
</head>
<body class="bg-gray-50">

  <main x-data="reportsApp()" x-init="init()" x-cloak>
    <!-- Header -->
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-slate-800">Отчёты</h1>
      <p class="text-sm text-slate-500 mt-1">Аналитика и экспорт данных</p>
    </div>

    <!-- Report type tabs -->
    <div class="flex flex-wrap gap-2 mb-6" role="tablist" aria-label="Тип отчёта">
      <template x-for="tab in reportTypes" :key="tab.value">
        <button
          class="px-4 py-2 rounded-lg text-sm font-medium transition"
          :class="activeType === tab.value ? 'bg-blue-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
          @click="activeType = tab.value"
          role="tab"
          :aria-selected="activeType === tab.value"
          x-text="tab.label"
        ></button>
      </template>
    </div>

    <!-- Filters -->
    <div class="card p-4 mb-6">
      <div class="flex flex-col sm:flex-row gap-3 items-end">
        <div class="field flex-1">
          <label for="date-from">Дата начала</label>
          <input type="date" id="date-from" x-model="dateFrom">
        </div>
        <div class="field flex-1">
          <label for="date-to">Дата окончания</label>
          <input type="date" id="date-to" x-model="dateTo">
        </div>
        <button class="btn btn-primary" @click="generateReport()" :disabled="generating">
          <svg x-show="generating" class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
          <span x-text="generating ? 'Генерация...' : 'Сформировать'"></span>
        </button>
      </div>
    </div>

    <!-- Results -->
    <div x-show="results.length > 0" x-transition>
      <!-- Export buttons -->
      <div class="flex gap-2 mb-4">
        <button class="btn btn-secondary text-sm" @click="exportReport('csv')">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
          CSV
        </button>
        <button class="btn btn-secondary text-sm" @click="exportReport('excel')">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
          Excel
        </button>
        <button class="btn btn-secondary text-sm" @click="exportReport('pdf')">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
          PDF
        </button>
      </div>

      <!-- Results table -->
      <div class="card overflow-hidden">
        <div class="overflow-x-auto">
          <table class="data-table">
            <thead>
              <tr>
                <template x-for="col in columns" :key="col.key">
                  <th x-text="col.label"></th>
                </template>
              </tr>
            </thead>
            <tbody>
              <template x-for="(row, idx) in results" :key="idx">
                <tr>
                  <template x-for="col in columns" :key="col.key">
                    <td x-text="col.format ? col.format(row[col.key]) : row[col.key]"></td>
                  </template>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Empty state -->
    <div x-show="results.length === 0 && !generating" class="card p-12 text-center">
      <svg class="w-16 h-16 text-slate-300 mx-auto mb-4" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      <p class="text-slate-500">Выберите тип отчёта и период, затем нажмите «Сформировать»</p>
    </div>
  </main>

  <script>
    function reportsApp() {
      return {
        activeType: 'organizations',
        reportTypes: [
          { value: 'organizations', label: 'Организации' },
          { value: 'employees', label: 'Сотрудники' },
          { value: 'policies', label: 'Полисы' },
          { value: 'claims', label: 'Заявки' },
          { value: 'financial', label: 'Финансовый' }
        ],
        dateFrom: '',
        dateTo: '',
        generating: false,
        results: [],
        columns: [],

        async init() {
          window.InsurePro.mountChrome('reports');
          // Set default dates
          const now = new Date();
          const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
          this.dateFrom = firstDay.toISOString().split('T')[0];
          this.dateTo = now.toISOString().split('T')[0];
        },

        async generateReport() {
          this.generating = true;
          this.results = [];
          try {
            const params = new URLSearchParams({
              type: this.activeType,
              date_from: this.dateFrom,
              date_to: this.dateTo
            });
            const data = await window.InsurePro.apiFetch(`/reports/?${params}`);
            this.columns = data.columns || [];
            this.results = data.results || [];
          } catch {
            this.loadDemoReport();
          }
          this.generating = false;
        },

        loadDemoReport() {
          const fmt = (val) => window.InsurePro.formatCurrency(val);

          switch (this.activeType) {
            case 'organizations':
              this.columns = [
                { key: 'name', label: 'Организация' },
                { key: 'inn', label: 'ИНН' },
                { key: 'employees', label: 'Сотрудников' },
                { key: 'policies', label: 'Полисов' },
                { key: 'total', label: 'Сумма', format: fmt }
              ];
              this.results = [
                { name: 'ООО «ТехноСофт»', inn: '7701234567', employees: 47, policies: 2, total: 2160000 },
                { name: 'АО «ФинТех»', inn: '7702345678', employees: 120, policies: 3, total: 4800000 },
                { name: 'ООО «Альфа»', inn: '7703456789', employees: 25, policies: 1, total: 1080000 }
              ];
              break;
            case 'employees':
              this.columns = [
                { key: 'name', label: 'ФИО' },
                { key: 'company', label: 'Компания' },
                { key: 'plan', label: 'План' },
                { key: 'claims', label: 'Заявок' },
                { key: 'total_claims', label: 'Сумма заявок', format: fmt }
              ];
              this.results = [
                { name: 'Иванов И.И.', company: 'ООО «ТехноСофт»', plan: 'Стандарт', claims: 3, total_claims: 48000 },
                { name: 'Петрова А.С.', company: 'ООО «ТехноСофт»', plan: 'Стандарт', claims: 1, total_claims: 35000 },
                { name: 'Сидоров В.К.', company: 'АО «ФинТех»', plan: 'Премиум', claims: 2, total_claims: 125000 }
              ];
              break;
            case 'policies':
              this.columns = [
                { key: 'id', label: '№' },
                { key: 'company', label: 'Компания' },
                { key: 'plan', label: 'План' },
                { key: 'status', label: 'Статус' },
                { key: 'cost', label: 'Стоимость', format: fmt }
              ];
              this.results = [
                { id: '#1001', company: 'ООО «ТехноСофт»', plan: 'Стандарт', status: 'Активен', cost: 2160000 },
                { id: '#1002', company: 'АО «ФинТех»', plan: 'Премиум', status: 'Активен', cost: 4800000 },
                { id: '#1003', company: 'ИП Козлов', plan: 'Базовый', status: 'Черновик', cost: 300000 }
              ];
              break;
            case 'claims':
              this.columns = [
                { key: 'id', label: '№' },
                { key: 'type', label: 'Тип' },
                { key: 'employee', label: 'Сотрудник' },
                { key: 'status', label: 'Статус' },
                { key: 'amount', label: 'Сумма', format: fmt }
              ];
              this.results = [
                { id: '#501', type: 'Амбулаторное', employee: 'Иванов И.И.', status: 'На рассмотрении', amount: 12500 },
                { id: '#502', type: 'Стоматология', employee: 'Петрова А.С.', status: 'Одобрена', amount: 35000 },
                { id: '#503', type: 'Госпитализация', employee: 'Сидоров В.К.', status: 'Рассматривается', amount: 85000 }
              ];
              break;
            case 'financial':
              this.columns = [
                { key: 'month', label: 'Месяц' },
                { key: 'income', label: 'Доход', format: fmt },
                { key: 'claims_paid', label: 'Выплаты', format: fmt },
                { key: 'profit', label: 'Прибыль', format: fmt },
                { key: 'margin', label: 'Маржа' }
              ];
              this.results = [
                { month: 'Январь 2025', income: 4850000, claims_paid: 1200000, profit: 3650000, margin: '75.3%' },
                { month: 'Декабрь 2024', income: 4600000, claims_paid: 980000, profit: 3620000, margin: '78.7%' },
                { month: 'Ноябрь 2024', income: 4400000, claims_paid: 1100000, profit: 3300000, margin: '75.0%' }
              ];
              break;
          }
        },

        async exportReport(format) {
          try {
            const params = new URLSearchParams({
              type: this.activeType,
              date_from: this.dateFrom,
              date_to: this.dateTo,
              format: format
            });
            const response = await fetch(`${window.InsurePro.BASE_URL}/reports/export/?${params}`, {
              headers: { Authorization: `Bearer ${localStorage.getItem('insurepro_token')}` }
            });
            if (response.ok) {
              const blob = await response.blob();
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = `report_${this.activeType}_${this.dateFrom}.${format === 'excel' ? 'xlsx' : format}`;
              a.click();
              URL.revokeObjectURL(url);
              window.InsurePro.toast('Отчёт скачан', 'success');
            } else {
              throw new Error();
            }
          } catch {
            window.InsurePro.toast('Экспорт недоступен в демо-режиме', 'warning');
          }
        }
      };
    }
  </script>
</body>
</html>
